<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      padding: 40px;
      text-align: center;
    }
    .loading {
      color: #64748b;
      font-size: 1.1rem;
    }
    .error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="loading">Loading site...</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const app = document.getElementById('app');

    // Get slug from URL query parameter
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    async function loadSite() {
      if (!slug) {
        app.innerHTML = `<div class="error">❌ No site specified.</div>`;
        return;
      }

      try {
        const { data, error } = await supabase
          .from('sites')
          .select('*')
          .eq('slug', slug)
          .eq('published', true)
          .single();

        if (error || !data) {
          app.innerHTML = `<div class="error">❌ Site not found or not published yet.</div>`;
          return;
        }

        // Render the site HTML
        app.innerHTML = data.html || '<p>No content yet.</p>';

        // Inject custom CSS if exists
        if (data.css) {
          const style = document.createElement('style');
          style.textContent = data.css;
          document.head.appendChild(style);
        }

        // Execute custom JS if exists
        if (data.js) {
          const script = document.createElement('script');
          script.textContent = data.js;
          document.body.appendChild(script);
        }

        // Increment views (optional)
        supabase
          .from('sites')
          .update({ views: (data.views || 0) + 1 })
          .eq('id', data.id)
          .then(({ error }) => error && console.error('View update error:', error));

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="error">❌ Error loading site: ${err.message}</div>`;
      }
    }

    loadSite();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- في <head> من site.html -->
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:image" content="{{image}}" />
<meta property="og:url" content="{{url}}" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
  <title>Loading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0c29;
      color: #fff;
      padding: 20px;
    }
    .loader {
      text-align: center;
    }
    .loader .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 255, 255, 0.06);
      border-top-color: #4facfe;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .loader p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.9rem;
    }
    .error {
      text-align: center;
      max-width: 400px;
    }
    .error h1 {
      font-size: 4rem;
      margin-bottom: 8px;
    }
    .error p {
      color: rgba(255, 255, 255, 0.5);
    }
    .error a {
      color: #4facfe;
      text-decoration: none;
      display: inline-block;
      margin-top: 16px;
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 40px;
      transition: all 0.3s;
    }
    .error a:hover {
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="loader">
      <div class="spinner"></div>
      <p>Loading site...</p>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ===== SUPABASE ===== -->
  <!-- ============================================================ -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const app = document.getElementById('app');

    // Get slug from URL
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    async function loadSite() {
      if (!slug) {
        app.innerHTML = `
          <div class="error">
            <h1>404</h1>
            <p>No site specified.</p>
            <a href="/">Go Home</a>
          </div>
        `;
        return;
      }

      try {
        const { data, error } = await supabase
          .from('sites')
          .select('*')
          .eq('slug', slug)
          .eq('published', true)
          .single();

        if (error || !data || !data.html) {
          app.innerHTML = `
            <div class="error">
              <h1>404</h1>
              <p>Site not found or not published yet.</p>
              <a href="/">Go Home</a>
            </div>
          `;
          return;
        }

        // ===== IMPORTANT: Render the full page =====
        // Replace the entire document with the site's HTML
        // But we need to preserve the URL and allow navigation back

        // Get the site's HTML
        let fullHtml = data.html;

        // If the site HTML doesn't have its own <html> tag,
        // wrap it with a full document structure
        if (!fullHtml.includes('<!DOCTYPE html') && !fullHtml.includes('<html')) {
          fullHtml = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${data.title || 'My Site'}</title>
  ${data.css ? `<style>${data.css}</style>` : ''}
  ${data.js ? `<script>${data.js}<\/script>` : ''}
</head>
<body>
  ${fullHtml}
</body>
</html>
          `;
        }

        // Replace the entire page content
        document.open();
        document.write(fullHtml);
        document.close();

        // Increment views (async)
        supabase
          .from('sites')
          .update({ views: (data.views || 0) + 1 })
          .eq('id', data.id)
          .then(({ error }) => error && console.error('View update error:', error));

      } catch (err) {
        console.error(err);
        app.innerHTML = `
          <div class="error">
            <h1>⚠️</h1>
            <p>Error loading site: ${err.message}</p>
            <a href="/">Go Home</a>
          </div>
        `;
      }
    }

    // ===== في site.html =====
function updateSEO(data) {
  // ===== Title =====
  const title = data.title || 'My Site';
  document.title = `${title} | LP Generator`;

  // ===== Meta Description =====
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) {
    metaDesc.content = data.description || `Check out ${title} - built with LP Generator`;
  } else {
    const meta = document.createElement('meta');
    meta.name = 'description';
    meta.content = data.description || `Check out ${title} - built with LP Generator`;
    document.head.appendChild(meta);
  }

  // ===== Open Graph (Facebook, LinkedIn) =====
  const ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) {
    ogTitle.content = title;
  } else {
    const meta = document.createElement('meta');
    meta.property = 'og:title';
    meta.content = title;
    document.head.appendChild(meta);
  }

  const ogUrl = document.querySelector('meta[property="og:url"]');
  if (ogUrl) {
    ogUrl.content = window.location.href;
  } else {
    const meta = document.createElement('meta');
    meta.property = 'og:url';
    meta.content = window.location.href;
    document.head.appendChild(meta);
  }

  // ===== Twitter Card =====
  const twitterCard = document.querySelector('meta[name="twitter:card"]');
  if (!twitterCard) {
    const meta = document.createElement('meta');
    meta.name = 'twitter:card';
    meta.content = 'summary_large_image';
    document.head.appendChild(meta);
  }
}

    // ===== في site.html، أضف أزرار المشاركة =====
function addSocialButtons(slug, title) {
  const container = document.getElementById('social-share');
  if (!container) return;

  const url = window.location.href;
  
  container.innerHTML = `
    <div style="display:flex;gap:12px;justify-content:center;padding:20px 0;border-top:1px solid rgba(255,255,255,0.06);">
      <button onclick="shareSite('facebook')" style="background:transparent;border:none;color:#1877f2;font-size:1.5rem;cursor:pointer;">📘</button>
      <button onclick="shareSite('twitter')" style="background:transparent;border:none;color:#1da1f2;font-size:1.5rem;cursor:pointer;">🐦</button>
      <button onclick="shareSite('linkedin')" style="background:transparent;border:none;color:#0a66c2;font-size:1.5rem;cursor:pointer;">🔗</button>
      <button onclick="shareSite('copy')" style="background:transparent;border:none;color:rgba(255,255,255,0.5);font-size:1.5rem;cursor:pointer;">📋</button>
    </div>
  `;
}

window.shareSite = function(platform) {
  const url = window.location.href;
  const title = document.title || 'My Site';
  
  const shareUrls = {
    facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
    twitter: `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`,
    linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`,
    copy: null
  };
  
  if (platform === 'copy') {
    navigator.clipboard.writeText(url).then(() => {
      alert('✅ Link copied!');
    });
  } else {
    window.open(shareUrls[platform], '_blank', 'width=600,height=400');
  }
};

    loadSite();
  </script>
</body>
</html>

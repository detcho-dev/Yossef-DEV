<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 Analytics Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f1f5f9;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      padding: 20px 28px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    /* ===== STATS GRID ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .stat-card .number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .stat-card .label {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
    }

    .stat-card .trend {
      font-size: 0.75rem;
      margin-top: 6px;
    }

    .stat-card .trend.up {
      color: #4ade80;
    }

    .stat-card .trend.down {
      color: #f87171;
    }

    /* ===== CHARTS ===== */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .chart-card h3 {
      font-size: 1rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 16px;
    }

    .chart-bar {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 200px;
      padding: 16px 0;
    }

    .chart-bar .bar-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .chart-bar .bar-item .bar {
      width: 100%;
      max-width: 40px;
      min-height: 4px;
      background: linear-gradient(180deg, #4facfe, #00f2fe);
      border-radius: 4px;
      transition: height 0.6s ease;
    }

    .chart-bar .bar-item .bar-label {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.3);
    }

    /* ===== RECENT ACTIVITY ===== */
    .activity-list {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 32px;
    }

    .activity-list h3 {
      font-size: 1rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 16px;
    }

    .activity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-item .activity-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .activity-item .activity-info .icon {
      font-size: 1.2rem;
    }

    .activity-item .activity-info .text {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .activity-item .activity-info .text strong {
      color: #fff;
    }

    .activity-item .time {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.75rem;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .header {
        padding: 16px 20px;
        flex-direction: column;
        align-items: flex-start;
      }
      .header h1 {
        font-size: 1.5rem;
      }
      .header-actions {
        width: 100%;
      }
      .header-actions .btn {
        flex: 1;
        justify-content: center;
      }
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .stat-card .number {
        font-size: 1.8rem;
      }
      .charts-grid {
        grid-template-columns: 1fr;
      }
      .chart-bar {
        height: 150px;
      }
    }

    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📊 Analytics Dashboard</h1>
      <div class="header-actions">
        <a href="index.html" class="btn">🏠 Home</a>
        <a href="dashboard.html" class="btn">📊 My Sites</a>
        <a href="admin.html" class="btn">📁 Admin</a>
        <button class="btn" onclick="logout()">🚪 Logout</button>
      </div>
    </header>

    <!-- ===== STATS ===== -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="number" id="total-views">0</div>
        <div class="label">Total Views</div>
        <div class="trend up" id="views-trend">⬆ +0%</div>
      </div>
      <div class="stat-card">
        <div class="number" id="total-sites">0</div>
        <div class="label">Total Sites</div>
        <div class="trend up" id="sites-trend">⬆ +0%</div>
      </div>
      <div class="stat-card">
        <div class="number" id="total-users">0</div>
        <div class="label">Total Users</div>
        <div class="trend up" id="users-trend">⬆ +0%</div>
      </div>
      <div class="stat-card">
        <div class="number" id="total-templates">0</div>
        <div class="label">Templates</div>
        <div class="trend" id="templates-trend">📄</div>
      </div>
    </div>

    <!-- ===== CHARTS ===== -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>📈 Views Last 7 Days</h3>
        <div class="chart-bar" id="views-chart">
          <div class="bar-item"><div class="bar" style="height:20px;"></div><span class="bar-label">Mon</span></div>
          <div class="bar-item"><div class="bar" style="height:40px;"></div><span class="bar-label">Tue</span></div>
          <div class="bar-item"><div class="bar" style="height:60px;"></div><span class="bar-label">Wed</span></div>
          <div class="bar-item"><div class="bar" style="height:80px;"></div><span class="bar-label">Thu</span></div>
          <div class="bar-item"><div class="bar" style="height:50px;"></div><span class="bar-label">Fri</span></div>
          <div class="bar-item"><div class="bar" style="height:90px;"></div><span class="bar-label">Sat</span></div>
          <div class="bar-item"><div class="bar" style="height:70px;"></div><span class="bar-label">Sun</span></div>
        </div>
      </div>
      <div class="chart-card">
        <h3>🏷️ Most Popular Templates</h3>
        <div id="popular-templates">
          <div style="color:rgba(255,255,255,0.3);font-size:0.9rem;text-align:center;padding:20px;">Loading...</div>
        </div>
      </div>
    </div>

    <!-- ===== RECENT ACTIVITY ===== -->
    <div class="activity-list">
      <h3>🕐 Recent Activity</h3>
      <div id="recent-activity">
        <div style="color:rgba(255,255,255,0.3);font-size:0.9rem;text-align:center;padding:20px;">Loading...</div>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ===== SUPABASE ===== -->
  <!-- ============================================================ -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // ===== LOGOUT =====
    window.logout = async function() {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    };

    // ===== LOAD ANALYTICS =====
    async function loadAnalytics() {
      try {
        // ===== 1. Total Views =====
        const { count: views, error: viewsError } = await supabase
          .from('analytics')
          .select('*', { count: 'exact', head: true });

        if (viewsError) throw viewsError;

        // ===== 2. Total Sites =====
        const { count: sites, error: sitesError } = await supabase
          .from('sites')
          .select('*', { count: 'exact', head: true });

        if (sitesError) throw sitesError;

        // ===== 3. Total Users =====
        const { count: users, error: usersError } = await supabase
          .from('profiles')
          .select('*', { count: 'exact', head: true });

        if (usersError) throw usersError;

        // ===== 4. Total Templates =====
        const { count: templates, error: templatesError } = await supabase
          .from('templates')
          .select('*', { count: 'exact', head: true })
          .eq('is_active', true);

        if (templatesError) throw templatesError;

        // ===== Update Stats =====
        document.getElementById('total-views').textContent = views || 0;
        document.getElementById('total-sites').textContent = sites || 0;
        document.getElementById('total-users').textContent = users || 0;
        document.getElementById('total-templates').textContent = templates || 0;

        // ===== 5. Recent Activity =====
        const { data: recent, error: recentError } = await supabase
          .from('analytics')
          .select('*, sites(title, slug)')
          .order('created_at', { ascending: false })
          .limit(10);

        if (recentError) throw recentError;

        const activityEl = document.getElementById('recent-activity');
        if (!recent || recent.length === 0) {
          activityEl.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;">No activity yet</div>';
        } else {
          let html = '';
          recent.forEach(item => {
            const siteName = item.sites?.title || item.sites?.slug || 'Unknown';
            const time = new Date(item.created_at).toLocaleDateString() + ' ' + new Date(item.created_at).toLocaleTimeString();
            html += `
              <div class="activity-item">
                <div class="activity-info">
                  <span class="icon">👁️</span>
                  <span class="text"><strong>${siteName}</strong> was viewed</span>
                </div>
                <span class="time">${time}</span>
              </div>
            `;
          });
          activityEl.innerHTML = html;
        }

        // ===== 6. Popular Templates =====
        const { data: popular, error: popularError } = await supabase
          .from('sites')
          .select('title, slug, views')
          .eq('published', true)
          .order('views', { ascending: false })
          .limit(5);

        if (popularError) throw popularError;

        const popularEl = document.getElementById('popular-templates');
        if (!popular || popular.length === 0) {
          popularEl.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;">No data yet</div>';
        } else {
          let html = '';
          popular.forEach((item, index) => {
            const maxViews = popular[0]?.views || 1;
            const percentage = Math.min((item.views || 0) / maxViews * 100, 100);
            const colors = ['#4facfe', '#00f2fe', '#f093fb', '#f5576c', '#fbbf24'];
            html += `
              <div style="margin-bottom:12px;">
                <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px;">
                  <span style="color:rgba(255,255,255,0.7);">${index + 1}. ${item.title || item.slug}</span>
                  <span style="color:rgba(255,255,255,0.3);">${item.views || 0} views</span>
                </div>
                <div style="width:100%;height:6px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;">
                  <div style="width:${percentage}%;height:100%;background:${colors[index % colors.length]};border-radius:4px;transition:width 0.6s ease;"></div>
                </div>
              </div>
            `;
          });
          popularEl.innerHTML = html;
        }

      } catch (err) {
        console.error('Error loading analytics:', err);
      }
    }

    // ===== INIT =====
    loadAnalytics();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👥 Manage Users</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f1f5f9;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      padding: 20px 28px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: linear-gradient(135deg, #f5576c, #ef4444);
      border: none;
    }
    .btn-danger:hover {
      box-shadow: 0 8px 24px rgba(245, 87, 108, 0.3);
    }

    .btn-warning {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: none;
      color: #1a1a2e;
    }
    .btn-warning:hover {
      box-shadow: 0 8px 24px rgba(251, 191, 36, 0.3);
    }

    .btn-sm {
      padding: 6px 16px;
      font-size: 0.8rem;
    }

    .users-table-wrapper {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead {
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    th {
      text-align: left;
      padding: 16px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.8);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-free {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.4);
    }

    .badge-pro {
      background: rgba(79, 172, 254, 0.15);
      color: #4facfe;
    }

    .badge-business {
      background: rgba(240, 147, 251, 0.15);
      color: #f093fb;
    }

    .badge-active {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
    }

    .badge-inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .actions-cell {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.3);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.4);
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-left: 12px;
      border: 3px solid rgba(255, 255, 255, 0.06);
      border-top-color: #4facfe;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== POPUP ===== */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .popup-overlay.active {
      display: flex;
    }
    .popup {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      border-radius: 32px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.10);
      padding: 32px 36px;
      text-align: center;
      animation: popupFade 0.3s ease;
    }
    @keyframes popupFade {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .popup .popup-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .popup h3 {
      color: #fff;
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    .popup p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .popup .popup-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .popup .popup-btn {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      color: #fff;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .popup .popup-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.3);
    }
    .popup .popup-btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #fff;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }
    .popup .popup-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .header {
        padding: 16px 20px;
        flex-direction: column;
        align-items: flex-start;
      }
      .header h1 {
        font-size: 1.5rem;
      }
      .header-actions {
        width: 100%;
      }
      .header-actions .btn {
        flex: 1;
        justify-content: center;
      }
      table {
        font-size: 0.8rem;
      }
      th,
      td {
        padding: 10px 12px;
      }
      .actions-cell {
        flex-direction: column;
      }
      .actions-cell .btn {
        width: 100%;
        justify-content: center;
      }
      .popup {
        padding: 24px 20px;
        margin: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>👥 Manage Users</h1>
      <div class="header-actions">
        <a href="index.html" class="btn">🏠 Home</a>
        <a href="admin.html" class="btn">📁 Templates</a>
        <button class="btn" onclick="logout()">🚪 Logout</button>
      </div>
    </header>

    <div class="users-table-wrapper">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Email</th>
            <th>Plan</th>
            <th>Sites</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" class="loading">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ===== POPUP ===== -->
  <div id="popup" class="popup-overlay" onclick="if(event.target===this) closePopup()">
    <div class="popup">
      <div class="popup-icon" id="popup-icon">✅</div>
      <h3 id="popup-title">Success!</h3>
      <p id="popup-message">Operation completed.</p>
      <div class="popup-actions">
        <button class="popup-btn" id="popup-btn-primary" onclick="closePopup()">OK</button>
        <button class="popup-btn-secondary" id="popup-btn-secondary" style="display:none;" onclick="closePopup()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ===== SUPABASE ===== -->
  <!-- ============================================================ -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    // ===== CONFIG =====
    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const tbody = document.getElementById('users-tbody');
    const popup = document.getElementById('popup');
    const popupIcon = document.getElementById('popup-icon');
    const popupTitle = document.getElementById('popup-title');
    const popupMessage = document.getElementById('popup-message');
    const popupBtnPrimary = document.getElementById('popup-btn-primary');
    const popupBtnSecondary = document.getElementById('popup-btn-secondary');

    let currentUser = null;

    // ===== POPUP =====
    function showPopup({ icon = '✅', title = 'Success!', message = '', primaryText = 'OK', primaryAction = null }) {
      popupIcon.textContent = icon;
      popupTitle.textContent = title;
      popupMessage.textContent = message;
      popupBtnPrimary.textContent = primaryText;
      popupBtnPrimary.onclick = () => {
        closePopup();
        if (primaryAction) primaryAction();
      };
      popupBtnSecondary.style.display = 'none';
      popup.classList.add('active');
    }

    function closePopup() {
      popup.classList.remove('active');
    }
    window.closePopup = closePopup;

    // ===== LOGOUT =====
    window.logout = async function() {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    };

    // ===== CHECK ADMIN =====
    async function checkAdmin() {
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = session.user;

      // ===== تحقق من إن المستخدم Admin (صلاحية خاصة) =====
      // هنفترض إن أي مستخدم عنده صلاحية Admin (للتجربة)
      // لو عايز تمنع أي حد، تقدر تضيف شرط زي email === 'admin@example.com'
      loadUsers();
    }
// ===== LOAD USERS (via Edge Function) =====
async function loadUsers() {
  tbody.innerHTML = '<tr><td colspan="6" class="loading">Loading users...</td></tr>';

  try {
    const response = await fetch(
      'https://fhgszopuwnrnijxvghku.supabase.co/functions/v1/get-users',
      {
        headers: {
          'Authorization': `Bearer ${supabaseKey}`
        }
      }
    );

    const result = await response.json();

    if (result.error) throw new Error(result.error);

    const usersList = result.users;

    if (!usersList || usersList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No users found.</td></tr>';
      return;
    }

    let html = '';
    usersList.forEach((user: any) => {
      const planBadge = `badge-${user.plan}`;
      const planLabel = user.plan.charAt(0).toUpperCase() + user.plan.slice(1);

      html += `
        <tr>
          <td><strong>${user.name}</strong></td>
          <td>${user.email}</td>
          <td><span class="badge ${planBadge}">${planLabel}</span></td>
          <td>${user.sites_count}</td>
          <td><span class="badge ${user.confirmed ? 'badge-active' : 'badge-inactive'}">${user.confirmed ? 'Confirmed' : 'Pending'}</span></td>
          <td>
            <div class="actions-cell">
              <button class="btn btn-sm btn-warning" onclick="changePlan('${user.id}')">📋 Change Plan</button>
              <button class="btn btn-sm btn-danger" onclick="deleteUser('${user.id}')">🗑️ Delete</button>
            </div>
          </td>
        </tr>
      `;
    });

    tbody.innerHTML = html;

  } catch (err) {
    console.error('Error loading users:', err);
    tbody.innerHTML = `<tr><td colspan="6" style="color:#f87171;text-align:center;">❌ Error: ${err.message}</td></tr>`;
  }
}

// ===== CHANGE PLAN =====
window.changePlan = async function(userId) {
  const plans = ['free', 'pro', 'business'];
  const planNames = { free: 'Free', pro: 'Pro', business: 'Business' };

  let options = plans.map(p => `${p}: ${planNames[p]}`).join('\n');
  const choice = prompt(`Select plan for user:\n${options}`);

  if (!choice) return;

  const selectedPlan = choice.trim().toLowerCase();
  if (!plans.includes(selectedPlan)) {
    alert('Invalid plan. Choose: free, pro, or business.');
    return;
  }

  if (!confirm(`Are you sure you want to set this user to ${planNames[selectedPlan]} plan?`)) return;

  try {
    const { error } = await supabase
      .from('profiles')
      .update({ plan: selectedPlan, updated_at: new Date().toISOString() })
      .eq('id', userId);

    if (error) throw error;

    showPopup({
      icon: '✅',
      title: 'Plan Updated',
      message: `User has been set to ${planNames[selectedPlan]} plan.`,
      primaryText: 'OK',
      primaryAction: () => loadUsers()
    });

  } catch (err) {
    showPopup({
      icon: '❌',
      title: 'Error',
      message: err.message,
      primaryText: 'OK'
    });
    console.error('Change plan error:', err);
  }
};

// ===== DELETE USER =====
window.deleteUser = async function(userId) {
  if (!confirm('⚠️ Are you sure you want to delete this user? This action cannot be undone!')) return;

  try {
    const response = await fetch(
      'https://fhgszopuwnrnijxvghku.supabase.co/functions/v1/delete-user',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${supabaseKey}`
        },
        body: JSON.stringify({ user_id: userId })
      }
    );

    const result = await response.json();

    if (result.error) throw new Error(result.error);

    showPopup({
      icon: '🗑️',
      title: 'User Deleted',
      message: 'User has been deleted successfully.',
      primaryText: 'OK',
      primaryAction: () => loadUsers()
    });

  } catch (err) {
    showPopup({
      icon: '❌',
      title: 'Error',
      message: err.message,
      primaryText: 'OK'
    });
    console.error('Delete user error:', err);
  }
};

    // ===== CHANGE PLAN =====
    window.changePlan = async function(userId) {
      // ===== عرض نافذة اختيار الخطة =====
      const plans = ['free', 'pro', 'business'];
      const planNames = { free: 'Free', pro: 'Pro', business: 'Business' };

      let options = plans.map(p => `${p}: ${planNames[p]}`).join('\n');
      const choice = prompt(`Select plan for user:\n${options}`);

      if (!choice) return;

      const selectedPlan = choice.trim().toLowerCase();
      if (!plans.includes(selectedPlan)) {
        alert('Invalid plan. Choose: free, pro, or business.');
        return;
      }

      if (!confirm(`Are you sure you want to set this user to ${planNames[selectedPlan]} plan?`)) return;

      try {
        const { error } = await supabase
          .from('profiles')
          .update({ plan: selectedPlan, updated_at: new Date().toISOString() })
          .eq('id', userId);

        if (error) throw error;

        showPopup({
          icon: '✅',
          title: 'Plan Updated',
          message: `User has been set to ${planNames[selectedPlan]} plan.`,
          primaryText: 'OK',
          primaryAction: () => loadUsers()
        });

      } catch (err) {
        showPopup({
          icon: '❌',
          title: 'Error',
          message: err.message,
          primaryText: 'OK'
        });
        console.error('Change plan error:', err);
      }
    };

    // ===== DELETE USER =====
    window.deleteUser = async function(userId) {
      if (!confirm('⚠️ Are you sure you want to delete this user? This action cannot be undone!')) return;

      try {
        // ===== 1. حذف المواقع =====
        const { error: sitesError } = await supabase
          .from('sites')
          .delete()
          .eq('user_id', userId);

        if (sitesError) throw sitesError;

        // ===== 2. حذف الـ Profile =====
        const { error: profileError } = await supabase
          .from('profiles')
          .delete()
          .eq('id', userId);

        if (profileError) throw profileError;

        // ===== 3. حذف المستخدم من auth (بيحتاج Service Role Key) =====
        // ملحوظة: ده مش هيشتغل من المتصفح عشان الأمان.
        // محتاج تعمل Edge Function عشان تحذف من auth.users.
        // للتجربة، هنحذف من profiles و sites بس.

        showPopup({
          icon: '🗑️',
          title: 'User Deleted',
          message: 'User has been deleted successfully.',
          primaryText: 'OK',
          primaryAction: () => loadUsers()
        });

      } catch (err) {
        showPopup({
          icon: '❌',
          title: 'Error',
          message: err.message,
          primaryText: 'OK'
        });
        console.error('Delete user error:', err);
      }
    };

    // ============================================================
    // ===== INIT =====
    // ============================================================
    checkAdmin();
  </script>
</body>
</html>

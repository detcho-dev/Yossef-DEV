<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📁 Admin Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f1f5f9;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      padding: 20px 28px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: linear-gradient(135deg, #f5576c, #ef4444);
      border: none;
    }
    .btn-danger:hover {
      box-shadow: 0 8px 24px rgba(245, 87, 108, 0.3);
    }

    .btn-warning {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: none;
      color: #1a1a2e;
    }
    .btn-warning:hover {
      box-shadow: 0 8px 24px rgba(251, 191, 36, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
    }
    .btn-primary:hover {
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border: none;
    }
    .btn-success:hover {
      box-shadow: 0 8px 24px rgba(74, 222, 128, 0.3);
    }

    .btn-sm {
      padding: 6px 16px;
      font-size: 0.8rem;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 24px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s;
    }

    .tab-btn:hover {
      color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ===== TABLE ===== */
    .table-wrapper {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead {
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    th {
      text-align: left;
      padding: 16px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.8);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-active {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
    }

    .badge-inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .badge-free {
      background: rgba(74, 222, 128, 0.10);
      color: #4ade80;
    }

    .badge-paid {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
    }

    .badge-free-plan {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.4);
    }

    .badge-pro {
      background: rgba(79, 172, 254, 0.15);
      color: #4facfe;
    }

    .badge-business {
      background: rgba(240, 147, 251, 0.15);
      color: #f093fb;
    }

    .actions-cell {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.4);
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-left: 12px;
      border: 3px solid rgba(255, 255, 255, 0.06);
      border-top-color: #4facfe;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.3);
    }

    /* ===== FORM ===== */
    .form-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 24px 28px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 24px;
    }

    .form-card h3 {
      margin-bottom: 16px;
      color: rgba(255, 255, 255, 0.8);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      transition: border 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4facfe;
    }

    .form-group textarea {
      min-height: 100px;
      font-family: inherit;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    /* ===== POPUP ===== */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .popup-overlay.active {
      display: flex;
    }
    .popup {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      border-radius: 32px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.10);
      padding: 32px 36px;
      text-align: center;
      animation: popupFade 0.3s ease;
    }
    @keyframes popupFade {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .popup .popup-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .popup h3 {
      color: #fff;
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    .popup p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .popup .popup-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .popup .popup-btn {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      color: #fff;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .popup .popup-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.3);
    }
    .popup .popup-btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #fff;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }
    .popup .popup-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .header {
        padding: 16px 20px;
        flex-direction: column;
        align-items: flex-start;
      }
      .header h1 {
        font-size: 1.5rem;
      }
      .header-actions {
        width: 100%;
      }
      .header-actions .btn {
        flex: 1;
        justify-content: center;
      }
      .form-row,
      .form-row-3 {
        grid-template-columns: 1fr;
      }
      .tab-btn {
        font-size: 0.75rem;
        padding: 10px 12px;
      }
      table {
        font-size: 0.8rem;
      }
      th,
      td {
        padding: 10px 12px;
      }
      .actions-cell {
        flex-direction: column;
      }
      .actions-cell .btn {
        width: 100%;
        justify-content: center;
      }
      .popup {
        padding: 24px 20px;
        margin: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📁 Admin Panel</h1>
      <div class="header-actions">
        <a href="index.html" class="btn">🏠 Home</a>
        <button class="btn" onclick="logout()">🚪 Logout</button>
      </div>
    </header>

    <!-- ===== TABS ===== -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="templates" onclick="switchTab('templates')">📄 Templates</button>
      <button class="tab-btn" data-tab="users" onclick="switchTab('users')">👥 Users</button>
    </div>

    <!-- ============================================================ -->
    <!-- ===== TAB: TEMPLATES ===== -->
    <!-- ============================================================ -->
    <div id="tab-templates" class="tab-content active">
      <!-- Add Template Form -->
      <div class="form-card">
        <h3>➕ Add New Template</h3>
        <form id="template-form">
          <div class="form-row">
            <div class="form-group">
              <label>Template Name *</label>
              <input type="text" id="tpl-name" placeholder="e.g. Minimal Landing" required />
            </div>
            <div class="form-group">
              <label>Slug *</label>
              <input type="text" id="tpl-slug" placeholder="e.g. minimal-landing" required />
            </div>
          </div>
          <div class="form-group">
            <label>Cover Image URL</label>
            <input type="url" id="tpl-cover" placeholder="https://via.placeholder.com/400x200" />
          </div>
          <div class="form-group">
            <label>HTML Code *</label>
            <textarea id="tpl-html" placeholder="<div><h1>{{title}}</h1><p>{{subtitle}}</p></div>" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>CSS Code (optional)</label>
              <textarea id="tpl-css" placeholder=".my-class { color: red; }" style="min-height:80px;"></textarea>
            </div>
            <div class="form-group">
              <label>JS Code (optional)</label>
              <textarea id="tpl-js" placeholder="console.log('Hello');" style="min-height:80px;"></textarea>
            </div>
          </div>
          <div class="form-row-3">
            <div class="form-group">
              <label>Status</label>
              <select id="tpl-active">
                <option value="true">✅ Active</option>
                <option value="false">❌ Inactive</option>
              </select>
            </div>
            <div class="form-group">
              <label>Plan Type</label>
              <select id="tpl-free">
                <option value="true">🆓 Free</option>
                <option value="false">💎 Paid</option>
              </select>
            </div>
            
          </div>
          <button type="submit" class="btn btn-primary">💾 Save Template</button>
        </form>
      </div>

      <!-- Templates List -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Slug</th>
              <th>Type</th>
              <th>Fields</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="templates-tbody">
            <tr><td colspan="6" class="loading">Loading templates...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== TAB: USERS ===== -->
    <!-- ============================================================ -->
    <div id="tab-users" class="tab-content">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Plan</th>
              <th>Sites</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="6" class="loading">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== POPUP ===== -->
  <div id="popup" class="popup-overlay" onclick="if(event.target===this) closePopup()">
    <div class="popup">
      <div class="popup-icon" id="popup-icon">✅</div>
      <h3 id="popup-title">Success!</h3>
      <p id="popup-message">Operation completed.</p>
      <div class="popup-actions">
        <button class="popup-btn" id="popup-btn-primary" onclick="closePopup()">OK</button>
        <button class="popup-btn-secondary" id="popup-btn-secondary" style="display:none;" onclick="closePopup()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ===== SUPABASE ===== -->
  <!-- ============================================================ -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    // ============================================================
    // ===== CONFIG =====
    // ============================================================
    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // ============================================================
    // ===== DOM REFS =====
    // ============================================================
    const templatesTbody = document.getElementById('templates-tbody');
    const usersTbody = document.getElementById('users-tbody');
    const templateForm = document.getElementById('template-form');
    const popup = document.getElementById('popup');
    const popupIcon = document.getElementById('popup-icon');
    const popupTitle = document.getElementById('popup-title');
    const popupMessage = document.getElementById('popup-message');
    const popupBtnPrimary = document.getElementById('popup-btn-primary');
    const popupBtnSecondary = document.getElementById('popup-btn-secondary');

    // ============================================================
    // ===== POPUP =====
    // ============================================================
    function showPopup({ icon = '✅', title = 'Success!', message = '', primaryText = 'OK', primaryAction = null }) {
      popupIcon.textContent = icon;
      popupTitle.textContent = title;
      popupMessage.textContent = message;
      popupBtnPrimary.textContent = primaryText;
      popupBtnPrimary.onclick = () => {
        closePopup();
        if (primaryAction) primaryAction();
      };
      popupBtnSecondary.style.display = 'none';
      popup.classList.add('active');
    }

    function closePopup() {
      popup.classList.remove('active');
    }
    window.closePopup = closePopup;

    // ============================================================
    // ===== LOGOUT =====
    // ============================================================
    window.logout = async function() {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    };

    // ============================================================
    // ===== SWITCH TAB =====
    // ============================================================
    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('tab-' + tab).classList.add('active');
      document.querySelector('.tab-btn[data-tab="' + tab + '"]').classList.add('active');

      if (tab === 'templates') loadTemplates();
      if (tab === 'users') loadUsers();
    };

    // ============================================================
    // ===== TEMPLATES =====
    // ============================================================

    // ===== Load Templates =====
    async function loadTemplates() {
      templatesTbody.innerHTML = '<tr><td colspan="6" class="loading">Loading templates...</td></tr>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          templatesTbody.innerHTML = '<tr><td colspan="6" class="empty-state">No templates found.</td></tr>';
          return;
        }

        let html = '';
        data.forEach(function(tpl) {
          var fieldsCount = tpl.fields ? Object.keys(tpl.fields).length : 0;
          var statusBadge = tpl.is_active ? 'badge-active' : 'badge-inactive';
          var statusText = tpl.is_active ? 'Active' : 'Inactive';

          var typeBadge = tpl.is_free ? 'badge-free' : 'badge-paid';
          var typeText = tpl.is_free ? '🆓 Free' : '💎 Paid';

          html += `
            <tr>
              <td><strong>${tpl.name}</strong></td>
              <td><code style="color:rgba(255,255,255,0.5);">${tpl.slug}</code></td>
              <td><span class="badge ${typeBadge}">${typeText}</span></td>
              <td>${fieldsCount} fields</td>
              <td><span class="badge ${statusBadge}">${statusText}</span></td>
              <td>
                <div class="actions-cell">
                  <button class="btn btn-sm btn-warning" onclick="window.toggleTemplate('${tpl.id}', ${!tpl.is_active})">
                    ${tpl.is_active ? '🔴 Deactivate' : '🟢 Activate'}
                  </button>
                  <button class="btn btn-sm btn-success" onclick="window.toggleFree('${tpl.id}', ${!tpl.is_free})">
                    ${tpl.is_free ? '💎 Make Paid' : '🆓 Make Free'}
                  </button>
                  <button class="btn btn-sm btn-danger" onclick="window.deleteTemplate('${tpl.id}')">🗑️</button>
                </div>
              </td>
            </tr>
          `;
        });

        templatesTbody.innerHTML = html;

      } catch (err) {
        console.error('Error loading templates:', err);
        templatesTbody.innerHTML = `<tr><td colspan="6" style="color:#f87171;text-align:center;">❌ Error: ${err.message}</td></tr>`;
      }
    }

    // ===== Save Template =====
    templateForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      var name = document.getElementById('tpl-name').value.trim();
      var slug = document.getElementById('tpl-slug').value.trim();
      var cover_image = document.getElementById('tpl-cover').value.trim() || 'https://via.placeholder.com/400x200?text=Template';
      var html = document.getElementById('tpl-html').value.trim();
      var css = document.getElementById('tpl-css').value.trim();
      var js = document.getElementById('tpl-js').value.trim();
      var is_active = document.getElementById('tpl-active').value === 'true';
      var is_free = document.getElementById('tpl-free').value === 'true';

      if (!name || !slug || !html) {
        showPopup({ icon: '⚠️', title: 'Missing Fields', message: 'Name, Slug, and HTML are required.', primaryText: 'OK' });
        return;
      }

      // Extract fields from HTML
      var fields = {};
      var regex = /{{([a-zA-Z0-9_]+)}}/g;
      var match;
      while ((match = regex.exec(html)) !== null) {
        fields[match[1]] = {
          type: 'text',
          label: match[1].replace(/_/g, ' ').toUpperCase(),
          default: '',
          required: false,
          placeholder: 'Enter ' + match[1].replace(/_/g, ' ')
        };
      }

      try {
        var { error } = await supabase
          .from('templates')
          .insert([{
            name: name,
            slug: slug,
            cover_image: cover_image,
            html: html,
            css: css,
            js: js,
            fields: fields,
            is_active: is_active,
            is_free: is_free
          }]);

        if (error) throw error;

        showPopup({
          icon: '✅',
          title: 'Template Saved',
          message: 'Template "' + name + '" saved successfully! (' + Object.keys(fields).length + ' fields detected)',
          primaryText: 'OK',
          primaryAction: function() {
            templateForm.reset();
            loadTemplates();
          }
        });

      } catch (err) {
        showPopup({ icon: '❌', title: 'Error', message: err.message, primaryText: 'OK' });
        console.error('Save template error:', err);
      }
    });

    // ===== Toggle Template Status =====
    window.toggleTemplate = async function(id, newStatus) {
      try {
        var { error } = await supabase
          .from('templates')
          .update({ is_active: newStatus })
          .eq('id', id);

        if (error) throw error;

        loadTemplates();
        showPopup({
          icon: '✅',
          title: 'Template Updated',
          message: 'Template status changed successfully.',
          primaryText: 'OK'
        });

      } catch (err) {
        showPopup({ icon: '❌', title: 'Error', message: err.message, primaryText: 'OK' });
        console.error('Toggle template error:', err);
      }
    };

    // ===== Toggle Free/Paid =====
    window.toggleFree = async function(id, newFreeStatus) {
      try {
        var { error } = await supabase
          .from('templates')
          .update({ is_free: newFreeStatus })
          .eq('id', id);

        if (error) throw error;

        loadTemplates();
        showPopup({
          icon: '✅',
          title: 'Template Updated',
          message: 'Template pricing type changed successfully.',
          primaryText: 'OK'
        });

      } catch (err) {
        showPopup({ icon: '❌', title: 'Error', message: err.message, primaryText: 'OK' });
        console.error('Toggle free error:', err);
      }
    };

    // ===== Delete Template =====
    window.deleteTemplate = async function(id) {
      if (!confirm('Are you sure you want to delete this template?')) return;

      try {
        var { error } = await supabase
          .from('templates')
          .delete()
          .eq('id', id);

        if (error) throw error;

        loadTemplates();
        showPopup({
          icon: '🗑️',
          title: 'Template Deleted',
          message: 'Template has been deleted successfully.',
          primaryText: 'OK'
        });

      } catch (err) {
        showPopup({ icon: '❌', title: 'Error', message: err.message, primaryText: 'OK' });
        console.error('Delete template error:', err);
      }
    };

    // ============================================================
    // ===== USERS =====
    // ============================================================

    // ===== Load Users =====
    async function loadUsers() {
      usersTbody.innerHTML = '<tr><td colspan="6" class="loading">Loading users...</td></tr>';

      try {
        var response = await fetch(
          'https://fhgszopuwnrnijxvghku.supabase.co/functions/v1/get-users',
          {
            headers: {
              'Authorization': 'Bearer ' + supabaseKey
            }
          }
        );

        var result = await response.json();

        if (result.error) throw new Error(result.error);

        var usersList = result.users || [];

        if (usersList.length === 0) {
          usersTbody.innerHTML = '<tr><td colspan="6" class="empty-state">No users found.</td></tr>';
          return;
        }

        var html = '';
        usersList.forEach(function(user) {
          var planBadge = 'badge-' + user.plan;
          var planLabel = user.plan.charAt(0).toUpperCase() + user.plan.slice(1);

          html += `
            <tr>
              <td><strong>${user.name}</strong></td>
              <td>${user.email}</td>
              <td><span class="badge ${planBadge}">${planLabel}</span></td>
              <td>${user.sites_count}</td>
              <td><span class="badge ${user.confirmed ? 'badge-active' : 'badge-inactive'}">${user.confirmed ? 'Confirmed' : 'Pending'}</span></td>
              <td>
                <div class="actions-cell">
                  <button class="btn btn-sm btn-warning" onclick="window.changePlan('${user.id}')">📋 Change Plan</button>
                  <button class="btn btn-sm btn-danger" onclick="window.deleteUser('${user.id}')">🗑️ Delete</button>
                </div>
              </td>
            </tr>
          `;
        });

        usersTbody.innerHTML = html;

      } catch (err) {
        console.error('Error loading users:', err);
        usersTbody.innerHTML = `<tr><td colspan="6" style="color:#f87171;text-align:center;">❌ Error: ${err.message}</td></tr>`;
      }
    }

    // ===== Change Plan =====
    window.changePlan = async function(userId) {
      var plans = ['free', 'pro', 'business'];
      var planNames = { free: 'Free', pro: 'Pro', business: 'Business' };

      var options = plans.map(function(p) { return p + ': ' + planNames[p]; }).join('\n');
      var choice = prompt('Select plan for user:\n' + options);

      if (!choice) return;

      var selectedPlan = choice.trim().toLowerCase();
      if (plans.indexOf(selectedPlan) === -1) {
        alert('Invalid plan. Choose: free, pro, or business.');
        return;
      }

      if (!confirm('Are you sure you want to set this user to ' + planNames[selectedPlan] + ' plan?')) return;

      try {
        var { error } = await supabase
          .from('profiles')
          .update({ plan: selectedPlan, updated_at: new Date().toISOString() })
          .eq('id', userId);

        if (error) throw error;

        showPopup({
          icon: '✅',
          title: 'Plan Updated',
          message: 'User has been set to ' + planNames[selectedPlan] + ' plan.',
          primaryText: 'OK',
          primaryAction: function() { loadUsers(); }
        });

      } catch (err) {
        showPopup({ icon: '❌', title: 'Error', message: err.message, primaryText: 'OK' });
        console.error('Change plan error:', err);
      }
    };

    // ===== Delete User =====
    window.deleteUser = async function(userId) {
      if (!confirm('⚠️ Are you sure you want to delete this user? This action cannot be undone!')) return;

      try {
        var response = await fetch(
          'https://fhgszopuwnrnijxvghku.supabase.co/functions/v1/delete-user',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + supabaseKey
            },
            body: JSON.stringify({ user_id: userId })
          }
        );

        var result = await response.json();

        if (result.error) throw new Error(result.error);

        showPopup({
          icon: '🗑️',
          title: 'User Deleted',
          message: 'User has been deleted successfully.',
          primaryText: 'OK',
          primaryAction: function() { loadUsers(); }
        });

      } catch (err) {
        showPopup({ icon: '❌', title: 'Error', message: err.message, primaryText: 'OK' });
        console.error('Delete user error:', err);
      }
    };

    // ============================================================
    // ===== INIT =====
    // ============================================================
    loadTemplates();
    loadUsers();
  </script>
</body>
</html>

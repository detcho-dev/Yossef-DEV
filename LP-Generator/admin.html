<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Template Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0c29;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: rgba(255, 255, 255, 0.8);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      transition: border 0.3s;
      font-family: 'Courier New', monospace;
    }
    .form-group textarea {
      min-height: 120px;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4facfe;
    }
    .btn {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      color: #fff;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.3);
    }
    .btn-danger {
      background: linear-gradient(135deg, #f5576c, #f093fb);
    }
    .btn-danger:hover {
      box-shadow: 0 8px 24px rgba(245, 87, 108, 0.3);
    }
    .btn-sm {
      padding: 6px 16px;
      font-size: 0.8rem;
    }
    .template-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .template-item .info {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .template-item .info .badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
    }
    .template-item .actions {
      display: flex;
      gap: 8px;
    }
    .empty-msg {
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      padding: 40px;
    }
    .helper-text {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 4px;
    }
    .helper-text code {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .flex-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .flex-row .form-group {
      flex: 1;
      min-width: 200px;
    }
    .hidden {
      display: none !important;
    }
    .auth-check {
      text-align: center;
      padding: 40px;
    }
    .auth-check .btn {
      margin-top: 16px;
    }
    .preview-img {
      max-width: 100px;
      max-height: 60px;
      border-radius: 8px;
      object-fit: cover;
    }
    .badge-active {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
    }
    .badge-inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
    }
    @media (max-width: 768px) {
      .template-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .template-item .actions {
        width: 100%;
        justify-content: flex-start;
      }
      .flex-row {
        flex-direction: column;
      }
      .flex-row .form-group {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <h1>📁 Template Manager</h1>
      <div>
        <button class="btn btn-sm" onclick="checkAuth()" id="auth-status-btn">🔑 Login</button>
        <button class="btn btn-sm btn-danger" onclick="logout()" id="logout-btn" style="display:none;">🚪 Logout</button>
      </div>
    </div>

    <!-- ===== ADD TEMPLATE FORM ===== -->
    <div class="card" id="add-form">
      <h2>➕ Add New Template</h2>
      <form id="template-form">
        <div class="flex-row">
          <div class="form-group">
            <label>Template Name *</label>
            <input type="text" id="tpl-name" placeholder="e.g. Minimal Landing" required />
          </div>
          <div class="form-group">
            <label>Slug (URL identifier) *</label>
            <input type="text" id="tpl-slug" placeholder="e.g. minimal-landing" required />
            <div class="helper-text">Used in URL: <code>template-slug</code></div>
          </div>
        </div>
        <div class="form-group">
          <label>Cover Image URL</label>
          <input type="url" id="tpl-cover" placeholder="https://via.placeholder.com/400x200" />
        </div>
        <div class="form-group">
          <label>HTML Code *</label>
          <textarea id="tpl-html" placeholder="<div><h1>{{title}}</h1><p>{{subtitle}}</p></div>" required></textarea>
          <div class="helper-text">Use <code>{{variable}}</code> for dynamic fields. They will be auto-detected.</div>
        </div>
        <div class="form-group">
          <label>CSS Code (optional)</label>
          <textarea id="tpl-css" placeholder=".my-class { color: red; }"></textarea>
        </div>
        <div class="form-group">
          <label>JavaScript Code (optional)</label>
          <textarea id="tpl-js" placeholder="console.log('Hello');"></textarea>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="tpl-active">
            <option value="true">✅ Active</option>
            <option value="false">❌ Inactive</option>
          </select>
        </div>
        <button type="submit" class="btn">💾 Save Template</button>
      </form>
    </div>

    <!-- ===== TEMPLATES LIST ===== -->
    <div class="card">
      <h2>📋 Existing Templates</h2>
      <div id="templates-list">
        <div class="empty-msg">Loading templates...</div>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ===== SUPABASE ===== -->
  <!-- ============================================================ -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    // ===== CONFIG =====
    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const SITE_URL = window.location.origin + window.location.pathname;

    // ===== DOM REFS =====
    const templatesList = document.getElementById('templates-list');
    const form = document.getElementById('template-form');
    const authStatusBtn = document.getElementById('auth-status-btn');
    const logoutBtn = document.getElementById('logout-btn');

    let currentUser = null;

    // ============================================================
    // ===== AUTH =====
    // ============================================================

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();

      if (session) {
        currentUser = session.user;
        authStatusBtn.textContent = `👤 ${session.user.email}`;
        authStatusBtn.onclick = () => {};
        logoutBtn.style.display = 'inline-block';
        document.getElementById('add-form').style.display = 'block';
        loadTemplatesList();
      } else {
        currentUser = null;
        authStatusBtn.textContent = '🔑 Login';
        authStatusBtn.onclick = handleAuth;
        logoutBtn.style.display = 'none';
        document.getElementById('add-form').style.display = 'none';
        templatesList.innerHTML = `
          <div class="auth-check">
            <p>🔒 Please sign in to manage templates.</p>
            <button class="btn" onclick="handleAuth()">Sign In</button>
          </div>
        `;
      }
    }

    window.handleAuth = async function() {
      const email = prompt('Enter your email:');
      if (!email) return;

      const { error } = await supabase.auth.signInWithOtp({
        email: email,
        options: { emailRedirectTo: SITE_URL }
      });

      if (error) {
        alert('❌ ' + error.message);
      } else {
        alert('✅ Magic link sent! Check your email.');
      }
    };

    window.logout = async function() {
      await supabase.auth.signOut();
      location.reload();
    };

    // ============================================================
    // ===== AUTO-DETECT FIELDS FROM HTML =====
    // ============================================================

    function extractFieldsFromHTML(html) {
      const regex = /{{([a-zA-Z0-9_]+)}}/g;
      const matches = [];
      let match;

      while ((match = regex.exec(html)) !== null) {
        matches.push(match[1]);
      }

      // Remove duplicates
      const uniqueFields = [...new Set(matches)];

      const fields = {};
      uniqueFields.forEach(key => {
        fields[key] = {
          type: 'text',
          label: key.replace(/_/g, ' ').toUpperCase(),
          default: '',
          required: false,
          placeholder: `Enter ${key.replace(/_/g, ' ')}`
        };
      });

      return fields;
    }

    // ============================================================
    // ===== SAVE TEMPLATE =====
    // ============================================================

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('tpl-name').value.trim();
      const slug = document.getElementById('tpl-slug').value.trim();
      const cover_image = document.getElementById('tpl-cover').value.trim() || 'https://via.placeholder.com/400x200?text=Template';
      const html = document.getElementById('tpl-html').value.trim();
      const css = document.getElementById('tpl-css').value.trim();
      const js = document.getElementById('tpl-js').value.trim();
      const is_active = document.getElementById('tpl-active').value === 'true';

      if (!name || !slug || !html) {
        alert('❌ Name, Slug, and HTML are required.');
        return;
      }

      // ===== Auto-detect fields =====
      const fields = extractFieldsFromHTML(html);

      const templateData = {
        name,
        slug,
        cover_image,
        html,
        css,
        js,
        fields,
        is_active
      };

      try {
        const { data, error } = await supabase
          .from('templates')
          .insert([templateData]);

        if (error) throw error;

        alert(`✅ Template "${name}" saved successfully! (${Object.keys(fields).length} fields auto-detected)`);
        form.reset();
        loadTemplatesList();

      } catch (err) {
        alert('❌ Error: ' + err.message);
        console.error(err);
      }
    });

    // ============================================================
    // ===== LOAD TEMPLATES LIST =====
    // ============================================================

    async function loadTemplatesList() {
      templatesList.innerHTML = '<div class="empty-msg">Loading templates...</div>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          templatesList.innerHTML = '<div class="empty-msg">No templates yet. Add one above.</div>';
          return;
        }

        let html = '';
        data.forEach(tpl => {
          const fieldsCount = tpl.fields ? Object.keys(tpl.fields).length : 0;
          html += `
            <div class="template-item">
              <div class="info">
                <strong>${tpl.name}</strong>
                <span class="badge">#${tpl.slug}</span>
                <span class="${tpl.is_active ? 'badge-active' : 'badge-inactive'}">${tpl.is_active ? 'Active' : 'Inactive'}</span>
                <span style="font-size:0.7rem;color:rgba(255,255,255,0.3);">${fieldsCount} fields</span>
                ${tpl.cover_image ? `<img src="${tpl.cover_image}" class="preview-img" />` : ''}
              </div>
              <div class="actions">
                <button class="btn btn-sm btn-danger" onclick="deleteTemplate('${tpl.id}')">🗑️</button>
              </div>
            </div>
          `;
        });
        templatesList.innerHTML = html;

      } catch (err) {
        templatesList.innerHTML = `<div class="empty-msg">❌ Error: ${err.message}</div>`;
        console.error(err);
      }
    }

    // ============================================================
    // ===== DELETE TEMPLATE =====
    // ============================================================

    window.deleteTemplate = async function(id) {
      if (!confirm('Are you sure you want to delete this template?')) return;

      try {
        const { error } = await supabase
          .from('templates')
          .delete()
          .eq('id', id);

        if (error) throw error;

        alert('✅ Template deleted.');
        loadTemplatesList();

      } catch (err) {
        alert('❌ Error: ' + err.message);
        console.error(err);
      }
    };

    // ============================================================
    // ===== INIT =====
    // ============================================================

    // Expose functions to global scope
    window.checkAuth = checkAuth;
    window.handleAuth = window.handleAuth;
    window.logout = window.logout;

    checkAuth();
  </script>
</body>
</html>

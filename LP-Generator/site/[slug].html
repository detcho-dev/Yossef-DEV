<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <div style="text-align:center;padding:60px;color:#666;">Loading site...</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // Get slug from URL
    const slug = window.location.pathname.split('/').pop();

    async function loadSite() {
      try {
        const { data, error } = await supabase
          .from('sites')
          .select('*')
          .eq('slug', slug)
          .eq('published', true)
          .single();

        if (error || !data) {
          document.getElementById('app').innerHTML = `
            <div style="text-align:center;padding:80px;">
              <h1>404</h1>
              <p>Site not found or not published yet.</p>
            </div>
          `;
          return;
        }

        // Render the site HTML
        document.getElementById('app').innerHTML = data.html || '<p>No content yet.</p>';

        // Add custom CSS if exists
        if (data.css) {
          const style = document.createElement('style');
          style.textContent = data.css;
          document.head.appendChild(style);
        }

        // Execute custom JS if exists
        if (data.js) {
          const script = document.createElement('script');
          script.textContent = data.js;
          document.body.appendChild(script);
        }

        // Increment views
        supabase
          .from('sites')
          .update({ views: (data.views || 0) + 1 })
          .eq('id', data.id)
          .then(({ error }) => error && console.error('View update error:', error));

      } catch (err) {
        console.error(err);
        document.getElementById('app').innerHTML = `
          <div style="text-align:center;padding:80px;color:red;">
            ❌ Error loading site: ${err.message}
          </div>
        `;
      }
    }

    loadSite();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 LP Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 48px 40px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      text-align: center;
      color: #f1f5f9;
    }
    .container h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .container p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.05rem;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 16px;
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #4facfe;
      box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
    }
    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 32px rgba(79, 172, 254, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      font-weight: 500;
      display: none;
    }
    #message.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    #message.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    #message.info {
      display: block;
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.2);
    }
    .user-info {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: none;
    }
    .user-info.active {
      display: block;
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #fff;
      padding: 10px 24px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 12px;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .forgot-link {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.3s;
      display: block;
      margin-top: 12px;
    }
    .forgot-link:hover {
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 LP Generator</h1>
    <p>Sign in with email — no password needed</p>

    <!-- ===== Login Form ===== -->
    <div id="login-form">
      <div class="form-group">
        <input type="email" id="email-input" placeholder="Enter your email" />
      </div>
      <button class="btn-primary" id="signin-btn" onclick="handleSignIn()">
        Send Magic Link ✨
      </button>
      <div id="message"></div>
    </div>

    <!-- ===== User Info ===== -->
    <div id="user-info" class="user-info">
      <h3 id="user-name" style="margin-bottom:4px;">User</h3>
      <p id="user-email" style="color:rgba(255,255,255,0.4);font-size:0.9rem;"></p>
      <button class="btn-outline" onclick="signOut()">🚪 Sign Out</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ===== SUPABASE ===== -->
  <!-- ============================================================ -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    // ===== CONFIG =====
    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // ===== Site URL =====
    const SITE_URL = window.location.origin + window.location.pathname;

    // ===== DOM REFS =====
    const loginForm = document.getElementById('login-form');
    const userInfo = document.getElementById('user-info');
    const userName = document.getElementById('user-name');
    const userEmail = document.getElementById('user-email');
    const message = document.getElementById('message');
    const emailInput = document.getElementById('email-input');
    const signinBtn = document.getElementById('signin-btn');

    // ============================================================
    // ===== AUTH FUNCTIONS =====
    // ============================================================

    // ===== Passwordless Email =====
    window.handleSignIn = async function() {
      const email = emailInput.value.trim();
      if (!email) {
        showMessage('Please enter your email.', 'error');
        return;
      }

      signinBtn.disabled = true;
      signinBtn.textContent = '⏳ Sending...';
      showMessage('Sending magic link...', 'info');

      const { error } = await supabase.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo: SITE_URL
        }
      });

      signinBtn.disabled = false;
      signinBtn.textContent = 'Send Magic Link ✨';

      if (error) {
        if (error.message.includes('rate limit')) {
          showMessage('⏳ Too many requests. Please wait 5-10 minutes.', 'error');
        } else {
          showMessage('❌ ' + error.message, 'error');
        }
        console.error('SignIn error:', error);
      } else {
        showMessage('✅ Magic link sent! Check your email.', 'success');
        emailInput.value = '';
      }
    };

    // ===== Sign Out =====
    window.signOut = async function() {
      await supabase.auth.signOut();
      // Redirect to homepage
      window.location.href = '/';
    };

    // ===== Show Message =====
    function showMessage(text, type = 'info') {
      message.textContent = text;
      message.className = type;
      message.style.display = 'block';
    }

    // ============================================================
    // ===== CHECK AUTH =====
    // ============================================================
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();

      if (session) {
        // If user is logged in, redirect to homepage
        window.location.href = '/';
        return;
      } else {
        loginForm.style.display = 'block';
        userInfo.classList.remove('active');
      }
    }

    // ============================================================
    // ===== INIT =====
    // ============================================================
    checkAuth();

    // ===== Allow Enter key =====
    emailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        window.handleSignIn();
      }
    });
  </script>
</body>
</html>

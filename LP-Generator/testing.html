<!DOCTYPE html>
<html>
<head>
  <title>Passwordless Auth</title>
</head>
<body>
  <h1>🚀 Passwordless Email Auth</h1>

  <!-- نموذج تسجيل الدخول -->
  <div id="login-form">
    <h2>🔐 Sign in with Email</h2>
    <input type="email" id="email-input" placeholder="Enter your email" />
    <button onclick="handleSignIn()">Send Magic Link</button>
    <div id="message"></div>
  </div>

  <!-- معلومات المستخدم -->
  <div id="user-info" style="display:none;">
    <p>✅ Logged in as: <span id="user-email"></span></p>
    <button onclick="signOut()">Sign Out</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // ===== تسجيل الدخول =====
    window.handleSignIn = async function() {
      const email = document.getElementById('email-input').value;
      const message = document.getElementById('message');

      if (!email) {
        message.innerHTML = '⚠️ Please enter your email.';
        return;
      }

      message.innerHTML = '⏳ Sending magic link...';

      const { error } = await supabase.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo: window.location.origin + window.location.pathname
        }
      });

      if (error) {
        message.innerHTML = '❌ ' + error.message;
      } else {
        message.innerHTML = '✅ Magic link sent! Check your email.';
      }
    };

    // ===== تسجيل الخروج =====
    window.signOut = async function() {
      await supabase.auth.signOut();
      location.reload();
    };

    // ===== التحقق من الجلسة =====
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();

      if (session) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('user-email').textContent = session.user.email;
      } else {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('user-info').style.display = 'none';
      }
    }

    checkAuth();

    // ===== التعامل مع الـ Magic Link =====
    // Supabase بيشتغل تلقائياً مع الرابط
    // لما المستخدم يضغط على الرابط في الإيميل، Supabase بيسجل الدخول تلقائياً
  </script>
</body>
</html>

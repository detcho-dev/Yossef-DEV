<!DOCTYPE html>
<html>
<head>
    <title>Supabase Test</title>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    <div id="result">Loading...</div>

    <script type="module">
        // ===== Import Supabase =====
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // ===== Configuration =====
        const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function test() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ Connecting...';

            try {
                const { data, error } = await supabase
                    .from('templates')
                    .select('*');

                if (error) throw error;

                if (data && data.length > 0) {
                    result.innerHTML = `
                        ✅ <strong>Success!</strong><br>
                        Found ${data.length} templates:<br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    result.innerHTML = '✅ Connection works, but no templates found. Add one in the Table Editor.';
                }
            } catch (error) {
                result.innerHTML = `
                    ❌ <strong>Error:</strong><br>
                    Code: ${error.code}<br>
                    Message: ${error.message}
                `;
                console.error('Error:', error);
            }
        }

        test();
    </script>
</body>
</html>

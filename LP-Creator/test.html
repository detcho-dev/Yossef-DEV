<!DOCTYPE html>
<html>
<head>
    <title>Check Data</title>
</head>
<body>
    <h1>🔍 Checking Templates</h1>
    <div id="result">Loading...</div>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function checkData() {
            const result = document.getElementById('result');
            
            try {
                // 1. جيب كل البيانات من غير أي فلتر
                const { data, error, status, statusText } = await supabase
                    .from('templates')
                    .select('*');

                if (error) {
                    result.innerHTML = `
                        ❌ <strong>Error:</strong><br>
                        Code: ${error.code}<br>
                        Message: ${error.message}<br>
                        Details: ${error.details || 'No details'}<br>
                        Status: ${status}
                    `;
                    console.error('Error:', error);
                    return;
                }

                // 2. اعرض كل شيء
                result.innerHTML = `
                    <strong>✅ Connection Successful!</strong><br>
                    <strong>Status:</strong> ${status} ${statusText}<br>
                    <strong>Data length:</strong> ${data?.length || 0}<br>
                    <strong>Raw data:</strong><br>
                    <pre style="background:#f4f4f4;padding:10px;border-radius:5px;overflow:auto;max-height:400px;">${JSON.stringify(data, null, 2)}</pre>
                `;

                if (!data || data.length === 0) {
                    result.innerHTML += `
                        <br>
                        ⚠️ <strong>No templates found in the 'templates' table.</strong><br>
                        Please check:<br>
                        - Table name is exactly "templates" (lowercase)<br>
                        - Table is in "public" schema<br>
                        - Row Level Security (RLS) is disabled or has SELECT policy<br>
                        - Data was committed (not in a transaction)
                    `;
                }

            } catch (error) {
                result.innerHTML = `
                    ❌ <strong>Unexpected Error:</strong><br>
                    ${error.message}
                `;
                console.error('Unexpected error:', error);
            }
        }

        checkData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Build Your Site</title>
  <style>
    /* ===== نفس الاستيل السابق مع تعديلات بسيطة ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f1f5f9;
    }
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    .container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 40px;
      padding: 20px 28px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.05rem;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }
    .btn-primary {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      border: none;
    }
    .btn-primary:hover {
      box-shadow: 0 8px 32px rgba(245, 87, 108, 0.4);
    }

    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 28px;
      margin: 28px 0 40px;
    }
    .template-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.4s;
    }
    .template-card:hover {
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }
    .template-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .template-card .info {
      padding: 22px;
    }
    .template-card .info h3 {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 6px;
    }
    .template-card .info .badge {
      background: rgba(255, 255, 255, 0.10);
      color: #c7d2fe;
      padding: 4px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      display: inline-block;
    }
    .template-card .info .btn-use {
      margin-top: 16px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      color: #fff;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .template-card .info .btn-use:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(79, 172, 254, 0.4);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      border-radius: 32px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      padding: 32px 36px;
      animation: modalSlideUp 0.35s ease;
    }
    @keyframes modalSlideUp {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 18px;
      margin-bottom: 24px;
    }
    .modal-header h2 {
      color: #fff;
    }
    .modal-close {
      background: rgba(255, 255, 255, 0.06);
      color: #fca5a5;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .modal-close:hover {
      background: rgba(239, 68, 68, 0.2);
    }
    .modal-body {
      color: #e2e8f0;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.8);
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      transition: border 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4facfe;
    }
    .form-group textarea {
      min-height: 100px;
      font-family: inherit;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-left: 14px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #f093fb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 20px;
      }
      .header h1 {
        font-size: 1.7rem;
      }
      .templates-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }
      .modal {
        padding: 20px 18px;
      }
    }
    @media (max-width: 480px) {
      .templates-grid {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .template-card img {
        height: 130px;
      }
    }
    @media (max-width: 380px) {
      .templates-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header class="header">
      <div>
        <h1>🚀 Build Your Site</h1>
        <p>Choose a template, customize it, and publish your own website</p>
      </div>
      <div>
        <button class="btn" id="auth-btn" onclick="handleAuth()">🔑 Sign in</button>
      </div>
    </header>

    <!-- TEMPLATES GRID -->
    <div id="templates-grid" class="templates-grid">
      <div class="loading">Loading templates...</div>
    </div>
  </div>

  <!-- ===== MODAL: Customize Template ===== -->
  <div id="customize-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">✏️ Customize Your Site</h2>
        <button class="modal-close" onclick="closeCustomizeModal()">✕ Close</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- الحقول هتتعبأ ديناميكياً -->
      </div>
    </div>
  </div>

  <!-- ===== SUPABASE ===== -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // ===== DOM Refs =====
    const grid = document.getElementById('templates-grid');
    const authBtn = document.getElementById('auth-btn');
    const customizeModal = document.getElementById('customize-modal');
    const modalBody = document.getElementById('modal-body');
    const modalTitle = document.getElementById('modal-title');

    let currentUser = null;
    let selectedTemplate = null;

    // ===== AUTH =====
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        authBtn.innerHTML = '👤 ' + (session.user.user_metadata?.full_name || session.user.email);
        authBtn.onclick = () => supabase.auth.signOut().then(() => location.reload());
      } else {
        currentUser = null;
        authBtn.innerHTML = '🔑 Sign in';
        authBtn.onclick = handleAuth;
      }
    }

    window.handleAuth = async function() {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google', // or 'github', 'microsoft'
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });
      if (error) console.error('Auth error:', error);
    };

    // ===== LOAD TEMPLATES =====
    async function loadTemplates() {
      grid.innerHTML = '<div class="loading">Loading templates...</div>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .eq('is_active', true);

        if (error) throw error;

        if (!data || data.length === 0) {
          grid.innerHTML = '<p style="text-align:center;padding:60px;">No templates available.</p>';
          return;
        }

        let html = '';
        data.forEach(tpl => {
          html += `
            <div class="template-card">
              <img src="${tpl.cover_image || 'https://via.placeholder.com/400x200?text=Template'}" 
                   alt="${tpl.name}" loading="lazy" />
              <div class="info">
                <h3>${tpl.name}</h3>
                <span class="badge">#${tpl.slug}</span>
                <br>
                <button class="btn-use" onclick="window.useTemplate('${tpl.slug}')">
                  ✨ Use this template
                </button>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;

      } catch (err) {
        console.error(err);
        grid.innerHTML = `<p style="color:red;">❌ Error: ${err.message}</p>`;
      }
    }

    // ===== USE TEMPLATE (Open Customize Modal) =====
    window.useTemplate = async function(slug) {
      if (!currentUser) {
        alert('Please sign in first to create your site.');
        return;
      }

      try {
        // Fetch template
        const { data: template, error } = await supabase
          .from('templates')
          .select('*')
          .eq('slug', slug)
          .single();

        if (error) throw error;
        selectedTemplate = template;

        // Check if user already has a site with this template
        const { data: existing } = await supabase
          .from('sites')
          .select('*')
          .eq('user_id', currentUser.id)
          .eq('template_id', template.id)
          .maybeSingle();

        // Build form from template fields
        const fields = template.fields || {};
        let formHtml = `
          <form id="site-form">
            <div class="form-group">
              <label>Your Site Slug (username)</label>
              <input type="text" id="site-slug" value="${currentUser.user_metadata?.username || currentUser.email.split('@')[0]}" 
                     placeholder="my-site" required />
              <small style="color:rgba(255,255,255,0.4);">This will be your site URL: <span id="slug-preview">your-site</span>.domain.com</small>
            </div>
        `;

        // Generate fields from template.fields
        for (const [key, value] of Object.entries(fields)) {
          const label = key.replace(/_/g, ' ').toUpperCase();
          const val = existing?.data?.[key] || value;
          formHtml += `
            <div class="form-group">
              <label>${label}</label>
              <input type="text" id="field-${key}" value="${val || ''}" placeholder="${value || ''}" />
            </div>
          `;
        }

        formHtml += `
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">
              🚀 Publish My Site
            </button>
          </form>
        `;

        modalBody.innerHTML = formHtml;
        modalTitle.textContent = `✏️ ${template.name}`;
        customizeModal.classList.add('active');

        // Preview slug
        const slugInput = document.getElementById('site-slug');
        const slugPreview = document.getElementById('slug-preview');
        slugInput?.addEventListener('input', () => {
          slugPreview.textContent = slugInput.value || 'your-site';
        });
        slugPreview.textContent = slugInput?.value || 'your-site';

        // Handle form submit
        document.getElementById('site-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          await publishSite(template);
        });

      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
      }
    };

    window.closeCustomizeModal = function() {
      customizeModal.classList.remove('active');
    };

    // ===== PUBLISH SITE =====
    async function publishSite(template) {
      const slug = document.getElementById('site-slug').value.trim();
      if (!slug) {
        alert('Please enter a site name.');
        return;
      }

      // Collect field data
      const data = {};
      const fields = template.fields || {};
      for (const key of Object.keys(fields)) {
        const input = document.getElementById(`field-${key}`);
        if (input) data[key] = input.value;
      }

      // Generate HTML from template
      let html = template.html;
      for (const [key, value] of Object.entries(data)) {
        html = html.replace(new RegExp(`{{${key}}}`, 'g'), value);
      }

      try {
        // Save to sites table
        const { error: saveError } = await supabase
          .from('sites')
          .upsert({
            user_id: currentUser.id,
            template_id: template.id,
            slug: slug,
            title: data.title || slug,
            data: data,
            html: html,
            published: true,
            published_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          }, {
            onConflict: 'user_id, template_id'
          });

        if (saveError) throw saveError;

        alert(`✅ Your site is published!\n\n🔗 URL: https://${slug}.yourdomain.com\n(Replace with your actual domain)`);

        // Close modal
        closeCustomizeModal();

        // Open site preview
        window.open(`/site/${slug}`, '_blank');

      } catch (err) {
        console.error(err);
        alert('❌ Error publishing: ' + err.message);
      }
    }

    // ===== INIT =====
    await checkAuth();
    await loadTemplates();
  </script>
</body>
</html>

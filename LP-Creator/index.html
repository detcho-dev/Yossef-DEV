<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Gallery</title>
  <style>
    /* ----- Reset & Base ----- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    /* ----- Header ----- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #0f172a, #334155);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: #475569;
      font-size: 1.05rem;
      margin-top: 4px;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-admin {
      background: #1e293b;
      color: #f8fafc;
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .btn-admin:hover {
      background: #0f172a;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    /* ----- Grid ----- */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 28px;
      margin: 24px 0 40px;
    }

    /* ----- Card ----- */
    .template-card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      border: 1px solid rgba(226, 232, 240, 0.6);
      display: flex;
      flex-direction: column;
    }
    .template-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
      border-color: #cbd5e1;
    }
    .template-card:active {
      transform: scale(0.98);
    }
    .template-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
      background: #e2e8f0;
      transition: transform 0.5s ease;
    }
    .template-card:hover img {
      transform: scale(1.02);
    }
    .template-card .info {
      padding: 20px 20px 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .template-card .info h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .template-card .info .id-badge {
      background: #eef2ff;
      color: #4f46e5;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-block;
      align-self: flex-start;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .template-card .info .views {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      font-size: 0.85rem;
    }
    .template-card .info .views svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #94a3b8;
      stroke-width: 2;
    }

    /* ----- Viewer ----- */
    #template-viewer {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 36px;
      margin-top: 32px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
      border: 1px solid #e9edf2;
      display: none;
      animation: fadeSlideUp 0.35s ease;
    }
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #template-viewer .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
      border-bottom: 1px solid #e9edf2;
      padding-bottom: 18px;
      margin-bottom: 24px;
    }
    #template-viewer .viewer-header .title-group h2 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #0f172a;
    }
    #template-viewer .viewer-header .title-group .slug {
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 500;
      background: #f1f5f9;
      padding: 2px 14px;
      border-radius: 40px;
      display: inline-block;
      margin-top: 4px;
    }
    #template-viewer .close-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #template-viewer .close-btn:hover {
      background: #fecaca;
      transform: scale(0.96);
    }
    #template-viewer .template-display-area {
      background: #fafcff;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e9edf2;
      min-height: 120px;
    }

    /* ----- Loading & Empty ----- */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      font-size: 1.1rem;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-left: 12px;
      border: 3px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .error-msg {
      color: #b91c1c;
      background: #fee2e2;
      padding: 20px 28px;
      border-radius: 16px;
      border: 1px solid #fecaca;
      font-weight: 500;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: #f8fafc;
      border-radius: 24px;
      border: 2px dashed #d1d9e6;
    }
    .empty-state p {
      font-size: 1.1rem;
      color: #475569;
    }

    /* ----- Responsive ----- */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .header h1 {
        font-size: 1.7rem;
      }
      .header p {
        font-size: 0.95rem;
      }
      .templates-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }
      #template-viewer {
        padding: 20px 18px;
      }
      #template-viewer .viewer-header .title-group h2 {
        font-size: 1.3rem;
      }
      .btn-admin {
        padding: 8px 18px;
        font-size: 0.8rem;
      }
    }
    @media (max-width: 480px) {
      .templates-grid {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .template-card img {
        height: 130px;
      }
      .template-card .info {
        padding: 14px 14px 18px;
      }
      .template-card .info h3 {
        font-size: 1rem;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
      }
      .btn-admin {
        width: 100%;
        justify-content: center;
      }
    }
    @media (max-width: 380px) {
      .templates-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div>
        <h1>📁 Template Gallery</h1>
        <p>Browse and preview your landing page templates</p>
      </div>
      <div class="header-actions">
        <a href="admin.html" class="btn-admin">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Admin Panel
        </a>
      </div>
    </header>

    <!-- Grid -->
    <div id="templates-grid" class="templates-grid">
      <div class="loading">Loading templates</div>
    </div>

    <!-- Viewer -->
    <div id="template-viewer">
      <div class="viewer-header">
        <div class="title-group">
          <h2 id="viewer-title">Template</h2>
          <span class="slug" id="viewer-slug">#slug</span>
        </div>
        <button class="close-btn" onclick="closeViewer()">✕ Close</button>
      </div>
      <div id="template-content">
        <div class="loading" style="padding:30px;">Loading template…</div>
      </div>
    </div>
  </div>

  <!-- Import Map & Supabase -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // DOM refs
    const grid = document.getElementById('templates-grid');
    const viewer = document.getElementById('template-viewer');
    const content = document.getElementById('template-content');
    const viewerTitle = document.getElementById('viewer-title');
    const viewerSlug = document.getElementById('viewer-slug');

    // ----- Load templates -----
    async function loadTemplates() {
      grid.innerHTML = '<div class="loading">Loading templates</div>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <p>✨ No templates yet. <br><a href="admin.html" style="color:#4f46e5;font-weight:600;">Go to Admin Panel</a> to create your first template.</p>
            </div>
          `;
          return;
        }

        let html = '';
        data.forEach(tpl => {
          html += `
            <div class="template-card" onclick="window.showTemplate('${tpl.slug}')">
              <img src="${tpl.cover_image || 'https://via.placeholder.com/400x200?text=No+Image'}" 
                   alt="${tpl.name || 'Template'}" loading="lazy" />
              <div class="info">
                <h3>${tpl.name || 'Unnamed'}</h3>
                <span class="id-badge">#${tpl.slug}</span>
                <div class="views">
                  <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  ${tpl.views || 0} views
                </div>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;

      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="error-msg">❌ Error: ${err.message}</div>`;
      }
    }

    // ----- Show template -----
    async function showTemplate(slug) {
      viewer.style.display = 'block';
      content.innerHTML = '<div class="loading" style="padding:30px;">Loading template…</div>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .eq('slug', slug)
          .single();

        if (error) throw error;
        if (!data) {
          content.innerHTML = '<p style="color:red;">Template not found.</p>';
          return;
        }

        // Update header
        viewerTitle.textContent = data.name || 'Unnamed';
        viewerSlug.textContent = `#${data.slug}`;

        // Remove old styles
        document.querySelectorAll('style[id^="template-style-"]').forEach(el => el.remove());

        // Render HTML
        content.innerHTML = `
          <div class="template-display-area">
            ${data.html || '<p style="color:#999;">⚠️ No HTML content.</p>'}
          </div>
        `;

        // Inject CSS
        if (data.css) {
          const style = document.createElement('style');
          style.id = `template-style-${data.id}`;
          style.textContent = data.css;
          document.head.appendChild(style);
        }

        // Execute JS
        if (data.js) {
          const fn = new Function(`const templateData = ${JSON.stringify(data)}; ${data.js}`);
          setTimeout(fn, 0);
        }

        // Increment views
        supabase
          .from('templates')
          .update({ views: (data.views || 0) + 1 })
          .eq('id', data.id)
          .then(({ error }) => error && console.error('View update error:', error));

        // Update URL hash
        window.location.hash = `#/${data.slug}`;

      } catch (err) {
        console.error(err);
        content.innerHTML = `<p style="color:red;">❌ Error: ${err.message}</p>`;
      }
    }

    // ----- Close viewer -----
    function closeViewer() {
      viewer.style.display = 'none';
      document.querySelectorAll('style[id^="template-style-"]').forEach(el => el.remove());
      window.location.hash = '';
    }

    // Expose to global scope for inline onclick
    window.showTemplate = showTemplate;
    window.closeViewer = closeViewer;

    // ----- Hash change -----
    window.addEventListener('hashchange', () => {
      const slug = window.location.hash.substring(2);
      if (slug) showTemplate(slug);
      else closeViewer();
    });

    // ----- Init -----
    window.onload = () => {
      loadTemplates();
      const slug = window.location.hash.substring(2);
      if (slug) setTimeout(() => showTemplate(slug), 400);
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 Build Your Site</title>
  <style>
    /* ----- RESET & BASE ----- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f1f5f9;
    }
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    .container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    /* ----- HEADER ----- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 40px;
      padding: 20px 28px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.05rem;
      font-weight: 300;
    }
    .user-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      object-fit: cover;
    }
    .user-name {
      color: #fff;
      font-weight: 500;
    }
    .btn-login {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .btn-login:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.2);
    }
    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* ----- GRID ----- */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 28px;
      margin: 28px 0 40px;
    }

    /* ----- CARD ----- */
    .template-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.4s;
      display: flex;
      flex-direction: column;
    }
    .template-card:hover {
      transform: translateY(-10px) scale(1.01);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }
    .template-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .template-card .info {
      padding: 22px;
      flex: 1;
    }
    .template-card .info h3 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }
    .template-card .info .badge {
      background: rgba(255, 255, 255, 0.10);
      color: #c7d2fe;
      padding: 4px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      display: inline-block;
      margin-top: 4px;
    }
    .template-card .info .views {
      margin-top: 16px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
    }

    /* ----- BUTTONS ----- */
    .btn-primary {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 12px;
      width: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(245, 87, 108, 0.4);
    }

    /* ----- MODAL ----- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      border-radius: 32px;
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      padding: 32px 36px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 18px;
      margin-bottom: 24px;
    }
    .modal-header h2 {
      font-size: 1.8rem;
      color: #fff;
    }
    .modal-close {
      background: rgba(255, 255, 255, 0.06);
      color: #fca5a5;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 22px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .modal-close:hover {
      background: rgba(239, 68, 68, 0.2);
      transform: scale(0.95);
    }
    .modal-body {
      background: rgba(0, 0, 0, 0.20);
      border-radius: 20px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
    }
    .modal-body input,
    .modal-body textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
    }
    .modal-body input:focus,
    .modal-body textarea:focus {
      outline: none;
      border-color: #f5576c;
    }
    .modal-body label {
      display: block;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-left: 14px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #f093fb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 20px;
      }
      .header h1 {
        font-size: 1.7rem;
      }
      .templates-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }
      .modal {
        padding: 20px 18px;
      }
      .modal-header h2 {
        font-size: 1.3rem;
      }
    }
    @media (max-width: 480px) {
      .templates-grid {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .template-card img {
        height: 130px;
      }
      .template-card .info {
        padding: 14px;
      }
      .template-card .info h3 {
        font-size: 1rem;
      }
    }
    @media (max-width: 380px) {
      .templates-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ===== HEADER ===== -->
    <header class="header">
      <div>
        <h1>🚀 Build Your Site</h1>
        <p>Choose a template, customize it, and publish your site in seconds</p>
      </div>
      <div class="user-section" id="user-section">
        <!-- سيتم ملؤه بالـ JS -->
      </div>
    </header>

    <!-- ===== GRID ===== -->
    <div id="templates-grid" class="templates-grid">
      <div class="loading">Loading templates...</div>
    </div>
  </div>

  <!-- ===== MODAL ===== -->
  <div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">Customize Template</h2>
        <button class="modal-close" onclick="closeModal()">✕ Close</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <!-- ===== SUPABASE ===== -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    // ===== CONFIG =====
    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // ===== DOM REFS =====
    const grid = document.getElementById('templates-grid');
    const userSection = document.getElementById('user-section');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');

    // ================================================================
    // 1. AUTHENTICATION
    // ================================================================
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      const user = session?.user;

      if (user) {
        userSection.innerHTML = `
          <img src="${user.user_metadata?.avatar_url || 'https://ui-avatars.com/api/?name=' + user.email}" 
               class="user-avatar" alt="Avatar" />
          <span class="user-name">${user.user_metadata?.full_name || user.email}</span>
          <button class="btn-login btn-logout" onclick="logout()">Logout</button>
        `;
        return user;
      } else {
        userSection.innerHTML = `
          <button class="btn-login" onclick="login()">🔑 Sign In</button>
        `;
        return null;
      }
    }

    window.login = async function() {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + window.location.pathname
        }
      });
      if (error) console.error('Login error:', error);
    };

    window.logout = async function() {
      await supabase.auth.signOut();
      location.reload();
    };

    // ================================================================
    // 2. LOAD TEMPLATES
    // ================================================================
    async function loadTemplates() {
      grid.innerHTML = '<div class="loading">Loading templates...</div>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          grid.innerHTML = `<div class="empty-state"><p>✨ No templates yet.</p></div>`;
          return;
        }

        let html = '';
        data.forEach(tpl => {
          html += `
            <div class="template-card" onclick="openEditor('${tpl.slug}')">
              <img src="${tpl.cover_image || 'https://via.placeholder.com/400x200?text=Template'}" 
                   alt="${tpl.name}" loading="lazy" />
              <div class="info">
                <h3>${tpl.name}</h3>
                <span class="badge">#${tpl.slug}</span>
                <div class="views">👁️ ${tpl.views || 0} views</div>
                <button class="btn-primary">🚀 Use This Template</button>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;

      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div style="color:#fca5a5;">❌ Error: ${err.message}</div>`;
      }
    }

    // ================================================================
    // 3. EDITOR MODAL
    // ================================================================
    let currentTemplate = null;
    let currentUser = null;

    window.openEditor = async function(slug) {
      // Check if user is logged in
      const user = await checkAuth();
      if (!user) {
        alert('Please sign in first to use templates!');
        return;
      }
      currentUser = user;

      modalOverlay.classList.add('active');
      modalBody.innerHTML = '<div class="loading">Loading template...</div>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .eq('slug', slug)
          .single();

        if (error) throw error;
        if (!data) {
          modalBody.innerHTML = '<p style="color:#fca5a5;">Template not found.</p>';
          return;
        }

        currentTemplate = data;
        modalTitle.textContent = `✏️ Editing: ${data.name}`;

        // Generate editor form
        modalBody.innerHTML = `
          <form id="editor-form">
            <label>Site Name *</label>
            <input type="text" id="site-name" placeholder="My Awesome Site" required />

            <label>Subdomain * (your-site.${window.location.hostname})</label>
            <input type="text" id="site-subdomain" placeholder="my-awesome-site" required />

            <label>Your Content (HTML)</label>
            <textarea id="site-content" rows="6">${data.html || ''}</textarea>

            <label>Custom CSS (optional)</label>
            <textarea id="site-css" rows="4">${data.css || ''}</textarea>

            <button type="submit" class="btn-primary" style="margin-top:20px;">
              🚀 Publish Site
            </button>
          </form>
          <div id="publish-status" style="margin-top:16px;font-weight:500;"></div>
        `;

        // Handle form submission
        document.getElementById('editor-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          await publishSite();
        });

      } catch (err) {
        console.error(err);
        modalBody.innerHTML = `<p style="color:#fca5a5;">❌ Error: ${err.message}</p>`;
      }
    };

    // ================================================================
    // 4. PUBLISH SITE
    // ================================================================
    async function publishSite() {
      const statusDiv = document.getElementById('publish-status');
      const name = document.getElementById('site-name').value.trim();
      const subdomain = document.getElementById('site-subdomain').value.trim();
      const content = document.getElementById('site-content').value.trim();
      const css = document.getElementById('site-css').value.trim();

      if (!name || !subdomain || !content) {
        statusDiv.innerHTML = '<span style="color:#fca5a5;">❌ Please fill all required fields.</span>';
        return;
      }

      statusDiv.innerHTML = '<span style="color:#4facfe;">⏳ Publishing your site...</span>';

      try {
        // 1. Save to user_sites table
        const { data, error } = await supabase
          .from('user_sites')
          .insert([{
            user_id: currentUser.id,
            user_email: currentUser.email,
            template_id: currentTemplate.id,
            template_name: currentTemplate.name,
            site_name: name,
            subdomain: subdomain,
            html: content,
            css: css,
            status: 'published',
            published_at: new Date().toISOString()
          }])
          .select()
          .single();

        if (error) throw error;

        // 2. Generate the actual HTML
        const fullHtml = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${name}</title>
  <style>${css}</style>
</head>
<body>
  ${content}
</body>
</html>
        `;

        // 3. In a real system, you'd deploy this to a hosting service
        // For now, we'll store it in Supabase Storage or just show a preview

        // 4. Also save the HTML to storage
        const fileName = `${subdomain}-${Date.now()}.html`;
        const { error: uploadError } = await supabase.storage
          .from('sites')
          .upload(fileName, fullHtml, {
            contentType: 'text/html',
            upsert: true
          });

        if (uploadError) {
          console.warn('Storage upload warning:', uploadError);
          // Still show success since DB is saved
        }

        statusDiv.innerHTML = `
          ✅ <span style="color:#4ade80;">Site published successfully!</span><br>
          <span style="color:rgba(255,255,255,0.6);font-size:0.9rem;">
            🔗 Your site will be available at: 
            <strong>${subdomain}.${window.location.hostname}</strong>
          </span>
          <br><br>
          <button onclick="closeModal()" class="btn-primary" style="width:auto;padding:8px 24px;">
            ✨ Done
          </button>
        `;

        // Increment template views
        await supabase
          .from('templates')
          .update({ views: (currentTemplate.views || 0) + 1 })
          .eq('id', currentTemplate.id);

      } catch (err) {
        console.error('Publish error:', err);
        statusDiv.innerHTML = `<span style="color:#fca5a5;">❌ Error: ${err.message}</span>`;
      }
    }

    window.closeModal = function() {
      modalOverlay.classList.remove('active');
      document.querySelectorAll('style[id^="modal-style-"]').forEach(el => el.remove());
    };

    // ================================================================
    // 5. INIT
    // ================================================================
    window.onload = async function() {
      await checkAuth();
      await loadTemplates();

      // Check if user came back from OAuth
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        // Refresh user section
        await checkAuth();
      }
    };
  </script>
</body>
</html>

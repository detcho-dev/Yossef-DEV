<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ Template Gallery</title>
  <style>
    /* ----- RESET & BASE ----- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f1f5f9;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    /* ----- HEADER (Glassmorphism) ----- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 40px;
      padding: 20px 28px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .header:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.20);
      box-shadow: 0 16px 56px rgba(0, 0, 0, 0.6);
    }

    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 60px rgba(245, 87, 108, 0.25);
    }

    .header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 0.3px;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-admin {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-admin:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* ----- GRID ----- */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 28px;
      margin: 28px 0 40px;
    }

    /* ----- CARD (Glassmorphism) ----- */
    .template-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      flex-direction: column;
    }

    .template-card:hover {
      transform: translateY(-10px) scale(1.01);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }

    .template-card:active {
      transform: scale(0.97);
    }

    .template-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      background: rgba(0, 0, 0, 0.3);
      transition: transform 0.5s ease;
    }

    .template-card:hover img {
      transform: scale(1.04);
    }

    .template-card .info {
      padding: 22px 22px 26px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .template-card .info h3 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .template-card .info .id-badge {
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(4px);
      color: #c7d2fe;
      padding: 4px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-block;
      align-self: flex-start;
      margin-top: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .template-card .info .views {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
    }

    .template-card .info .views svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 2;
    }

    /* ================================================================ */
    /* ===== MODAL (POPUP) ===== */
    /* ================================================================ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    .modal {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      padding: 32px 36px;
      animation: modalSlideUp 0.35s cubic-bezier(0.2, 0, 0, 1);
    }

    @keyframes modalSlideUp {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 18px;
      margin-bottom: 24px;
    }

    .modal-header .title-group h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .modal-header .title-group .slug {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      font-weight: 400;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 16px;
      border-radius: 40px;
      display: inline-block;
      margin-top: 4px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .modal-close-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      color: #fca5a5;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .modal-close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.3);
      transform: scale(0.95);
      color: #fecaca;
    }

    .modal-body {
      background: rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      min-height: 120px;
      color: #e2e8f0;
    }

    /* ===== SCROLLBAR STYLING ===== */
    .modal::-webkit-scrollbar {
      width: 6px;
    }
    .modal::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
    }
    .modal::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    .modal::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ----- LOADING & EMPTY (same as before) ----- */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.1rem;
      font-weight: 300;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-left: 14px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #f093fb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-msg {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.10);
      padding: 20px 28px;
      border-radius: 20px;
      border: 1px solid rgba(239, 68, 68, 0.15);
      font-weight: 500;
      backdrop-filter: blur(4px);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 32px;
      border: 2px dashed rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
    }

    .empty-state p {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .empty-state a {
      color: #f093fb;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px dotted rgba(240, 147, 251, 0.3);
      transition: color 0.2s;
    }

    .empty-state a:hover {
      color: #f5576c;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .header {
        padding: 16px 20px;
        border-radius: 40px;
        flex-direction: column;
        align-items: flex-start;
      }
      .header h1 {
        font-size: 1.7rem;
      }
      .header p {
        font-size: 0.95rem;
      }
      .templates-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }
      .modal {
        padding: 20px 18px;
        margin: 12px;
        max-height: 95vh;
      }
      .modal-header .title-group h2 {
        font-size: 1.3rem;
      }
      .btn-admin {
        padding: 8px 20px;
        font-size: 0.8rem;
      }
      .modal-close-btn {
        padding: 8px 16px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .templates-grid {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .template-card img {
        height: 130px;
      }
      .template-card .info {
        padding: 14px 14px 18px;
      }
      .template-card .info h3 {
        font-size: 1rem;
      }
      .header-actions {
        width: 100%;
      }
      .btn-admin {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 380px) {
      .templates-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header class="header">
      <div>
        <h1>✨ Template Gallery</h1>
        <p>Stunning designs, one click away</p>
      </div>
      <div class="header-actions">
        <a href="admin.html" class="btn-admin">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Admin
        </a>
      </div>
    </header>

    <!-- GRID -->
    <div id="templates-grid" class="templates-grid">
      <div class="loading">Loading templates</div>
    </div>
  </div>

  <!-- ================================================================ -->
  <!-- ===== MODAL (POPUP) ===== -->
  <!-- ================================================================ -->
  <div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div class="title-group">
          <h2 id="modal-title">Template</h2>
          <span class="slug" id="modal-slug">#slug</span>
        </div>
        <button class="modal-close-btn" onclick="closeModal()">✕ Close</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="loading" style="padding:30px;">Loading template…</div>
      </div>
    </div>
  </div>

  <!-- ================================================================ -->
  <!-- SUPABASE -->
  <!-- ================================================================ -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';

    const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // DOM refs
    const grid = document.getElementById('templates-grid');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalSlug = document.getElementById('modal-slug');
    const modalBody = document.getElementById('modal-body');

    // ===== LOAD TEMPLATES =====
    async function loadTemplates() {
      grid.innerHTML = '<div class="loading">Loading templates</div>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <p>✨ No templates yet. <br><a href="admin.html">Go to Admin Panel</a> to create your first template.</p>
            </div>
          `;
          return;
        }

        let html = '';
        data.forEach(tpl => {
          html += `
            <div class="template-card" onclick="window.openModal('${tpl.slug}')">
              <img src="${tpl.cover_image || 'https://via.placeholder.com/400x200?text=No+Image'}" 
                   alt="${tpl.name || 'Template'}" loading="lazy" />
              <div class="info">
                <h3>${tpl.name || 'Unnamed'}</h3>
                <span class="id-badge">#${tpl.slug}</span>
                <div class="views">
                  <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  ${tpl.views || 0} views
                </div>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;

      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="error-msg">❌ Error: ${err.message}</div>`;
      }
    }

    // ===== OPEN MODAL =====
    async function openModal(slug) {
      // Show modal with loading state
      modalOverlay.classList.add('active');
      modalBody.innerHTML = '<div class="loading" style="padding:30px;">Loading template…</div>';

      try {
        const { data, error } = await supabase
          .from('templates')
          .select('*')
          .eq('slug', slug)
          .single();

        if (error) throw error;
        if (!data) {
          modalBody.innerHTML = '<p style="color:#fca5a5;">Template not found.</p>';
          return;
        }

        // Update header
        modalTitle.textContent = data.name || 'Unnamed';
        modalSlug.textContent = `#${data.slug}`;

        // Remove old injected styles
        document.querySelectorAll('style[id^="modal-style-"]').forEach(el => el.remove());

        // Render HTML inside modal
        modalBody.innerHTML = `
          <div style="background:rgba(0,0,0,0.10); border-radius:16px; padding:20px;">
            ${data.html || '<p style="color:rgba(255,255,255,0.4);">⚠️ No HTML content.</p>'}
          </div>
        `;

        // Inject CSS if present
        if (data.css) {
          const style = document.createElement('style');
          style.id = `modal-style-${data.id}`;
          style.textContent = data.css;
          document.head.appendChild(style);
        }

        // Execute JS if present
        if (data.js) {
          const fn = new Function(`const templateData = ${JSON.stringify(data)}; ${data.js}`);
          setTimeout(fn, 0);
        }

        // Increment views
        supabase
          .from('templates')
          .update({ views: (data.views || 0) + 1 })
          .eq('id', data.id)
          .then(({ error }) => error && console.error('View update error:', error));

        // Update URL hash
        window.location.hash = `#/${data.slug}`;

      } catch (err) {
        console.error(err);
        modalBody.innerHTML = `<p style="color:#fca5a5;">❌ Error: ${err.message}</p>`;
      }
    }

    // ===== CLOSE MODAL =====
    function closeModal() {
      modalOverlay.classList.remove('active');
      // Clean up injected styles
      document.querySelectorAll('style[id^="modal-style-"]').forEach(el => el.remove());
      window.location.hash = '';
    }

    // ===== Expose to global scope =====
    window.openModal = openModal;
    window.closeModal = closeModal;

    // ===== Hash change =====
    window.addEventListener('hashchange', () => {
      const slug = window.location.hash.substring(2);
      if (slug) {
        openModal(slug);
      } else {
        closeModal();
      }
    });

    // ===== Init =====
    window.onload = () => {
      loadTemplates();
      const slug = window.location.hash.substring(2);
      if (slug) setTimeout(() => openModal(slug), 400);
    };
  </script>
</body>
</html>

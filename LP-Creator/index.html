<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Gallery</title>
    <style>
        /* ===== CSS Variables (Color Scheme) ===== */
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(79, 70, 229, 0.15);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-light);
            font-size: 1.05rem;
        }

        .admin-link {
            background: var(--primary);
            color: white !important;
            -webkit-text-fill-color: white;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .admin-link:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }

        /* ===== Templates Grid ===== */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin: 20px 0;
        }

        /* ===== Template Card ===== */
        .template-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.03);
            position: relative;
        }

        .template-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .template-card .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #e2e8f0;
            transition: var(--transition);
        }

        .template-card:hover .card-image {
            transform: scale(1.02);
        }

        .template-card .info {
            padding: 20px;
        }

        .template-card .info h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .template-card .info .id-badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            letter-spacing: 0.3px;
        }

        .template-card .info .views {
            display: block;
            color: var(--text-light);
            font-size: 0.85rem;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .template-card .info .views::before {
            content: "👁️";
            font-size: 0.9rem;
        }

        /* ===== Loading Spinner ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .loading::after {
            content: "";
            display: inline-block;
            width: 30px;
            height: 30px;
            margin-left: 12px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================== */
        /* ===== MODAL (Template Viewer) ===== */
        /* =========================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 820px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.3s ease;
        }

        /* Custom scroll for modal */
        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .modal-close-btn {
            position: sticky;
            top: 0;
            float: right;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            z-index: 10;
        }

        .modal-close-btn:hover {
            background: #fecaca;
            transform: rotate(90deg);
        }

        .modal-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f1f5f9;
        }

        .modal-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .modal-header .slug-info {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .modal-header .slug-info strong {
            color: var(--text-dark);
        }

        .modal-header .cover-img {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px solid #e2e8f0;
        }

        .template-display-area {
            background: #fafbfc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-top: 8px;
            min-height: 100px;
        }

        /* ===== Animations ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== Responsive Design ===== */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .header p {
                font-size: 0.95rem;
                width: 100%;
            }

            .admin-link {
                padding: 8px 18px;
                font-size: 0.8rem;
            }

            .templates-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .template-card .card-image {
                height: 140px;
            }

            .template-card .info {
                padding: 14px;
            }
            .template-card .info h3 {
                font-size: 1rem;
            }

            .modal-content {
                padding: 20px;
                border-radius: 16px;
                max-height: 95vh;
            }

            .modal-header h2 {
                font-size: 1.4rem;
            }

            .modal-close-btn {
                width: 34px;
                height: 34px;
                font-size: 1.2rem;
            }

            .template-display-area {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .templates-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .template-card .card-image {
                height: 110px;
            }

            .template-card .info h3 {
                font-size: 0.9rem;
            }

            .template-card .info .id-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }

            .modal-content {
                padding: 16px;
            }
        }

        @media (max-width: 380px) {
            .templates-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== Error Message ===== */
        .error-msg {
            color: #dc2626;
            padding: 20px;
            background: #fef2f2;
            border-radius: 12px;
            border: 1px solid #fecaca;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== Header ===== -->
        <div class="header">
            <div>
                <h1>📁 Template Gallery</h1>
                <p>Browse and preview available templates</p>
            </div>
            <a href="admin.html" class="admin-link">⚙️ Admin Panel</a>
        </div>

        <!-- ===== Grid ===== -->
        <div id="templates-grid" class="templates-grid">
            <div class="loading">Loading templates</div>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- ===== MODAL (Viewer) ===== -->
    <!-- ========================================= -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close-btn" id="modal-close-btn">✕</button>
            <div id="modal-body">
                <div class="loading">Loading template...</div>
            </div>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- ===== SUPABASE SETUP ===== -->
    <!-- ========================================= -->
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>

    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        // ===== Configuration =====
        const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // ===== DOM Refs =====
        const grid = document.getElementById('templates-grid');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalBody = document.getElementById('modal-body');
        const closeBtn = document.getElementById('modal-close-btn');

        // ===== Load Templates =====
        async function loadTemplates() {
            grid.innerHTML = '<div class="loading">Loading templates</div>';

            try {
                const { data, error } = await supabase
                    .from('templates')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color: #64748b;">
                            <p style="font-size:1.2rem;">📭 No templates found.</p>
                            <p style="margin-top:8px;">Go to <strong>Admin Panel</strong> to add your first template.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                data.forEach(template => {
                    html += `
                        <div class="template-card" onclick="window.openTemplate('${template.slug}')">
                            <img class="card-image" src="${template.cover_image || 'https://via.placeholder.com/400x200?text=No+Image'}" 
                                 alt="${template.name || 'Template'}">
                            <div class="info">
                                <h3>${template.name || 'Unnamed'}</h3>
                                <span class="id-badge">#${template.slug}</span>
                                <span class="views">${template.views || 0} views</span>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;

            } catch (error) {
                console.error('Load error:', error);
                grid.innerHTML = `<div class="error-msg">❌ Failed to load templates: ${error.message}</div>`;
            }
        }

        // ===== Show Template in Modal =====
        async function openTemplate(slug) {
            // Show modal with loading state
            modalOverlay.classList.add('active');
            modalBody.innerHTML = '<div class="loading">Loading template</div>';

            try {
                const { data, error } = await supabase
                    .from('templates')
                    .select('*')
                    .eq('slug', slug)
                    .single();

                if (error) throw error;

                if (!data) {
                    modalBody.innerHTML = '<p style="color:red; text-align:center; padding:40px;">❌ Template not found.</p>';
                    return;
                }

                const template = data;

                // Remove old injected styles
                document.querySelectorAll('style[id^="template-style-"]').forEach(el => el.remove());

                // Build modal content
                modalBody.innerHTML = `
                    <div class="modal-header">
                        <h2>📄 ${template.name || 'Unnamed'}</h2>
                        <div class="slug-info"><strong>Slug:</strong> ${template.slug}</div>
                        ${template.cover_image ? `<img class="cover-img" src="${template.cover_image}" alt="Cover">` : ''}
                    </div>
                    <div class="template-display-area" id="template-display">
                        ${template.html || '<p style="color:#999;">⚠️ This template has no HTML content.</p>'}
                    </div>
                `;

                // Inject CSS
                if (template.css) {
                    const styleTag = document.createElement('style');
                    styleTag.id = `template-style-${template.id}`;
                    styleTag.textContent = template.css;
                    document.head.appendChild(styleTag);
                }

                // Execute JS
                if (template.js) {
                    const exec = new Function(`
                        const templateData = ${JSON.stringify(template)};
                        ${template.js}
                    `);
                    setTimeout(exec, 0);
                }

                // Increment views
                supabase
                    .from('templates')
                    .update({ views: (template.views || 0) + 1 })
                    .eq('id', template.id)
                    .then(({ error }) => {
                        if (error) console.error('View update error:', error);
                    });

                // Update URL hash
                window.location.hash = `#/${template.slug}`;

            } catch (error) {
                console.error('Open error:', error);
                modalBody.innerHTML = `<div class="error-msg">❌ Error: ${error.message}</div>`;
            }
        }

        // ===== Close Modal =====
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.querySelectorAll('style[id^="template-style-"]').forEach(el => el.remove());
            window.location.hash = '';
        }

        // ===== Event Listeners =====
        closeBtn.addEventListener('click', closeModal);

        // Close on overlay click (outside modal content)
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // ===== Hash Change =====
        window.addEventListener('hashchange', () => {
            const slug = window.location.hash.substring(2);
            if (slug) {
                openTemplate(slug);
            } else {
                closeModal();
            }
        });

        // ===== Expose to global scope for inline onclick =====
        window.openTemplate = openTemplate;
        window.closeModal = closeModal;

        // ===== Init =====
        window.onload = function() {
            loadTemplates();

            const slug = window.location.hash.substring(2);
            if (slug) {
                setTimeout(() => openTemplate(slug), 300);
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Test</title>
</head>
<body>
    <h1>🔍 Supabase Connection Test</h1>
    <div id="result">Loading...</div>

    <script type="module">
        // ===== Import Supabase =====
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // ===== Configuration =====
        const supabaseUrl = 'https://fhgszopuwnrnijxvghku.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZ3N6b3B1d25ybmlqeHZnaGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzQ1MTUsImV4cCI6MjA5OTYxMDUxNX0.K2WVDxjRh6JC51nZHdJpR2l8kjS1jhXJ9EkmQ5ElPtQ';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // ===== Test function =====
        async function testConnection() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ Connecting to Supabase...';

            try {
                // 1. Test: Try to get all templates
                const { data, error, status } = await supabase
                    .from('templates')
                    .select('*');

                if (error) {
                    result.innerHTML = `
                        ❌ <strong>Error:</strong><br>
                        Code: ${error.code}<br>
                        Message: ${error.message}<br>
                        Details: ${error.details || 'No details'}
                    `;
                    console.error('Supabase error:', error);
                    return;
                }

                // 2. Check if data exists
                if (data && data.length > 0) {
                    result.innerHTML = `
                        ✅ <strong>Success!</strong><br>
                        Found ${data.length} templates.<br><br>
                        <strong>Data:</strong><br>
                        <pre style="background:#f4f4f4;padding:10px;border-radius:5px;overflow:auto;">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    result.innerHTML = `
                        ⚠️ <strong>Connection works, but no templates found.</strong><br>
                        Please add a template in the Table Editor.<br><br>
                        <strong>Response:</strong><br>
                        <pre style="background:#f4f4f4;padding:10px;border-radius:5px;">Status: ${status}</pre>
                    `;
                }

            } catch (error) {
                result.innerHTML = `
                    ❌ <strong>Unexpected Error:</strong><br>
                    ${error.message}
                `;
                console.error('Unexpected error:', error);
            }
        }

        // ===== Run test =====
        testConnection();
    </script>
</body>
</html>
